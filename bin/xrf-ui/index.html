<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="icon" type="image/png" href="/icon.png" />
    <!-- Roboto is a fallback for platforms without Segoe, so it is declared but never preloaded. -->
    <link rel="stylesheet" href="/fonts/roboto/roboto.css" />

    <script inline-source src="/src/theme-init.ts"></script>

    <!--
      The window paints before react mounts, and until it does the only styles that exist are these.
      Without them the webview shows its own white default for as long as the bundle takes to boot,
      which on an otherwise dark application reads as a flash.
    -->
    <style>
      html {
        background-color: var(--preload-surface);
      }

      body {
        margin: 0;
      }
    </style>

    <style>
      .preload {
        display: flex;
        flex-direction: column;
        height: 100vh;
      }

      .preload-title-bar,
      .preload-status-bar,
      .preload-rail {
        box-sizing: border-box;
        flex-shrink: 0;
        border: 0 solid var(--preload-divider);
        background-color: var(--preload-paper);
      }

      .preload-title-bar {
        height: var(--preload-title-bar-height);
        border-bottom-width: 1px;
      }

      .preload-middle {
        display: flex;
        flex-grow: 1;
        min-height: 0;
        background-image: var(--preload-background);
      }

      .preload-rail {
        width: var(--preload-rail-width);
        border-right-width: 1px;
      }

      .preload-rail-right {
        border-right-width: 0;
        border-left-width: 1px;
      }

      .preload-canvas {
        flex-grow: 1;
      }

      .preload-status-bar {
        height: var(--preload-status-bar-height);
        border-top-width: 1px;
      }
    </style>

    <title>XRF tools</title>
  </head>

  <body>
    <div id="root">
      <div class="preload">
        <div class="preload-title-bar"></div>

        <div class="preload-middle">
          <div class="preload-rail"></div>
          <div class="preload-canvas"></div>
          <div class="preload-rail preload-rail-right"></div>
        </div>

        <div class="preload-status-bar"></div>
      </div>
    </div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
