[package]
name = "xrf-app"
version = "0.1.0"
publish = false
description = "XRF development tools"
authors = ["Neloreck"]
edition = "2024"
rust-version.workspace = true

[build-dependencies]
tauri-build = { version = "2.6.3", features = [
    "codegen"
] }

[dependencies]
env_logger = { workspace = true }
log = { workspace = true }
percent-encoding = "2.3.2"
serde = { workspace = true }
specta = { workspace = true, optional = true }
specta-serde = { workspace = true, optional = true }
specta-typescript = { workspace = true, optional = true }
specta-util = { workspace = true, optional = true }
tauri = { version = "2.11.5", features = [] }
tauri-specta = { workspace = true, optional = true }
tauri-plugin-dialog = "2.7.2"
tauri-plugin-fs = "2.5.1"
tauri-plugin-shell = "2.3.5"
xrf-archive = { workspace = true }
xrf-vfs = { workspace = true }
xrf-db = { workspace = true }
xrf-dds = { workspace = true }
xrf-dialog = { workspace = true }
xrf-error = { workspace = true }
xrf-export = { workspace = true }
xrf-ltx = { workspace = true }
xrf-output = { workspace = true }
xrf-sound = { workspace = true }
xrf-texture = { workspace = true }
xrf-utils = { workspace = true }
xrf-translation = { workspace = true }
xrf-visual = { workspace = true }
xrf-pack = { workspace = true }

[features]
# This feature is used for production builds or when a dev server is not specified, DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]
# Emits TypeScript mirrors and command bindings. Nothing in a normal build turns this on.
typescript-bindings = [
    "specta",
    "specta-serde",
    "specta-typescript",
    "specta-util",
    "tauri-specta",
    "xrf-archive/typescript-bindings",
    "xrf-vfs/typescript-bindings",
    "xrf-db/typescript-bindings",
    "xrf-dialog/typescript-bindings",
    "xrf-error/typescript-bindings",
    "xrf-export/typescript-bindings",
    "xrf-ltx/typescript-bindings",
    "xrf-texture/typescript-bindings",
    "xrf-translation/typescript-bindings",
    "xrf-visual/typescript-bindings",
    "xrf-pack/typescript-bindings",
]

[lints]
workspace = true
