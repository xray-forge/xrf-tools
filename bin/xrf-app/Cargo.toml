[package]
name = "xrf-app"
version = "0.1.0"
publish = false
description = "XRF development tools"
authors = ["Neloreck"]
edition.workspace = true
rust-version.workspace = true

[build-dependencies]
xrf-build-info = { workspace = true }
tauri-build = { version = "2.6.3", features = [
  "codegen"
] }

[dependencies]
bytes = { workspace = true }
env_logger = { workspace = true }
getrandom = { workspace = true }
glam = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
indexmap = { workspace = true }
log = { workspace = true }
percent-encoding = "2.3.2"
rayon = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
specta = { workspace = true, optional = true }
specta-serde = { workspace = true, optional = true }
specta-typescript = { workspace = true, optional = true }
specta-util = { workspace = true, optional = true }
sysinfo = { workspace = true }
tauri = { version = "2.12.0", features = [] }
tauri-specta = { workspace = true, optional = true }
tauri-plugin-dialog = "2.7.3"
tauri-plugin-fs = "2.5.2"
tauri-plugin-shell = "2.3.6"
tauri-plugin-store = "2.4.5"
tokio = { workspace = true }
uuid = { workspace = true, features = ["serde", "v4"] }
xrf-archive = { workspace = true }
xrf-chunk = { workspace = true }
xrf-archive-stats = { workspace = true }
xrf-build-info = { workspace = true }
xrf-job = { workspace = true, features = ["rayon"] }
xrf-vfs = { workspace = true }
xrf-math = { workspace = true }
xrf-ogf = { workspace = true }
xrf-skeleton = { workspace = true }
xrf-dds = { workspace = true }
xrf-dialog = { workspace = true }
xrf-error = { workspace = true }
xrf-export = { workspace = true }
xrf-extension = { workspace = true }
xrf-gamedata = { workspace = true }
xrf-ipc-typescript = { workspace = true, optional = true }
xrf-dltx = { workspace = true }
xrf-engine-target = { workspace = true }
xrf-environment = { workspace = true }
xrf-level = { workspace = true }
xrf-ltx = { workspace = true }
xrf-ltx-inspect = { workspace = true }
xrf-material = { workspace = true }
xrf-output = { workspace = true }
xrf-sound = { workspace = true }
xrf-texture = { workspace = true }
xrf-utils = { workspace = true }
xrf-translation = { workspace = true }
xrf-typescript = { workspace = true, optional = true }
xrf-visual = { workspace = true }
xrf-pack = { workspace = true }
xrf-animation-envelope = { workspace = true }
xrf-anm = { workspace = true }
xrf-efd = { workspace = true }
xrf-gamemtl = { workspace = true }
xrf-light-anim = { workspace = true }
xrf-omf = { workspace = true }
xrf-ppe = { workspace = true }
xrf-thm = { workspace = true }
xrf-shaders = { workspace = true }
xrf-spawn = { workspace = true }
xrf-particles = { workspace = true }
xrf-renderer = { workspace = true }
image = { workspace = true, features = ["png"] }

# Both already in the tree through wry, at the versions it resolves: the memory reading asks WebView2 for its processes.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39.1"
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_System_ProcessStatus",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging"
] }

[dev-dependencies]
# The mock runtime, which dispatches a command the way a webview would without one.
tauri = { version = "2.12.0", features = ["test"] }
xrf-material = { workspace = true, features = ["fixtures"] }
xrf-test-utils = { workspace = true }

[features]
# This feature is used for production builds or when a dev server is not specified, DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]
# Emits TypeScript mirrors and command bindings. Nothing in a normal build turns this on.
typescript-bindings = [
  "specta",
  "xrf-typescript/codegen",
  "specta-serde",
  "specta-typescript",
  "specta-util",
  "xrf-ipc-typescript",
  "tauri-specta",
  "xrf-archive/typescript-bindings",
  "xrf-build-info/typescript-bindings",
  "xrf-job/typescript-bindings",
  "xrf-vfs/typescript-bindings",
  "xrf-spawn/typescript-bindings",
  "xrf-math/typescript-bindings",
  "xrf-dialog/typescript-bindings",
  "xrf-engine-target/typescript-bindings",
  "xrf-environment/typescript-bindings",
  "xrf-level/typescript-bindings",
  "xrf-error/typescript-bindings",
  "xrf-export/typescript-bindings",
  "xrf-ltx/typescript-bindings",
  "xrf-ltx-inspect/typescript-bindings",
  "xrf-material/typescript-bindings",
  "xrf-texture/typescript-bindings",
  "xrf-translation/typescript-bindings",
  "xrf-visual/typescript-bindings",
  "xrf-renderer/typescript-bindings",
  "xrf-pack/typescript-bindings",
  "xrf-archive-stats/typescript-bindings",
]

[lints]
workspace = true
