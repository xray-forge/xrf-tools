[package]
name = "xrf-app-render"
version = "0.1.0"
publish = false
description = "XRF development tools: native viewports the renderer draws into the application's windows"
authors = ["Neloreck"]
edition.workspace = true
rust-version.workspace = true
# Core's, which embeds the manifest a Tauri test binary needs on Windows.
build = "../../core/build.rs"

[dependencies]
image = { workspace = true, features = ["png", "tga"] }
log = { workspace = true }
notify = { workspace = true }
profiling = { workspace = true }
serde = { workspace = true }
specta = { workspace = true, optional = true }
tauri = { workspace = true }
tauri-specta = { workspace = true, optional = true }
xrf-app-core = { workspace = true }
xrf-error = { workspace = true }
xrf-job = { workspace = true, features = ["rayon"] }
xrf-material = { workspace = true }
xrf-renderer = { workspace = true }
xrf-utils = { workspace = true }
xrf-vfs = { workspace = true }
xrf-world = { workspace = true }

# The window's client area and instance, which native viewports draw their surface over.
[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

# Already in the tree through tao, wry and wgpu: the view under the webview that native viewports are drawn in.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
  "std",
  "NSGraphics",
  "NSResponder",
  "NSView",
  "NSWindow",
  "objc2-quartz-core",
] }
# Walks a view's subviews.
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSEnumerator"] }
objc2-quartz-core = { version = "0.3.2", default-features = false, features = [
  "std",
  "CALayer",
  "CAMetalLayer",
  "objc2-core-foundation",
] }

[dev-dependencies]
rayon = { workspace = true }
# The mock runtime, which dispatches a command the way a webview would without one.
tauri = { workspace = true, features = ["test"] }
xrf-app-core = { workspace = true, features = ["fixtures"] }
xrf-environment = { workspace = true }
xrf-test-utils = { workspace = true }
xrf-visual = { workspace = true }

[features]
# Emits TypeScript mirrors and command bindings. Nothing in a normal build turns this on.
typescript-bindings = [
  "specta",
  "tauri-specta",
  "xrf-app-core/typescript-bindings",
  "xrf-error/typescript-bindings",
  "xrf-job/typescript-bindings",
  "xrf-material/typescript-bindings",
  "xrf-renderer/typescript-bindings",
  "xrf-vfs/typescript-bindings",
  "xrf-world/typescript-bindings",
]

[lints]
workspace = true
