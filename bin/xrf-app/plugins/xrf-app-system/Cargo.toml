[package]
name = "xrf-app-system"
version = "0.1.0"
publish = false
description = "XRF development tools: desktop paths and diagnostics of the running application"
authors = ["Neloreck"]
edition.workspace = true
rust-version.workspace = true
# Core's, which embeds the manifest a Tauri test binary needs on Windows.
build = "../../core/build.rs"

[dependencies]
log = { workspace = true }
serde = { workspace = true }
specta = { workspace = true, optional = true }
sysinfo = { workspace = true }
tauri = { workspace = true }
tauri-specta = { workspace = true, optional = true }
xrf-app-core = { workspace = true }
xrf-app-render = { workspace = true }
xrf-build-info = { workspace = true }
xrf-env-flags = { workspace = true }
xrf-renderer = { workspace = true }
xrf-utils = { workspace = true }

# Both already in the tree through wry, at the versions it resolves: the memory reading asks WebView2 for its processes.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39.1"
windows = { workspace = true, features = ["Win32_Foundation", "Win32_System_ProcessStatus", "Win32_System_Threading"] }

[dev-dependencies]
serde_json = { workspace = true }
# The mock runtime, which dispatches a command the way a webview would without one.
tauri = { workspace = true, features = ["test"] }
xrf-app-core = { workspace = true, features = ["fixtures"] }

[features]
# Emits TypeScript mirrors and command bindings. Nothing in a normal build turns this on.
typescript-bindings = [
  "specta",
  "tauri-specta",
  "xrf-app-core/typescript-bindings",
  "xrf-app-render/typescript-bindings",
  "xrf-build-info/typescript-bindings",
  "xrf-env-flags/typescript-bindings",
  "xrf-renderer/typescript-bindings",
]

[lints]
workspace = true
