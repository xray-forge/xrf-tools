[package]
name = "xrf-app-core"
version = "0.1.0"
publish = false
description = "XRF development tools: the infrastructure every desktop plugin builds on"
authors = ["Neloreck"]
edition.workspace = true
rust-version.workspace = true

[dependencies]
bytes = { workspace = true }
dirs = "7.0.0"
env_logger = { workspace = true }
getrandom = "0.4.3"
http-body-util = "0.1.5"
hyper = { version = "1.11.1", features = ["http1", "server"] }
hyper-util = { version = "0.1.20", features = ["tokio"] }
log = { workspace = true }
rayon = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
specta = { workspace = true, optional = true }
specta-typescript = { workspace = true, optional = true }
tauri = { workspace = true }
tauri-specta = { workspace = true, optional = true }
tokio = { version = "1.53.1", features = ["net", "rt"] }
uuid = { workspace = true, features = ["serde", "v4"] }
xrf-dds = { workspace = true }
xrf-engine-target = { workspace = true }
xrf-env-flags = { workspace = true }
xrf-error = { workspace = true }
xrf-ipc-typescript = { workspace = true, optional = true }
xrf-job = { workspace = true, features = ["rayon"] }
xrf-utils = { workspace = true }
xrf-vfs = { workspace = true }

[dev-dependencies]
# The mock runtime, which dispatches a command the way a webview would without one.
tauri = { workspace = true, features = ["test"] }
xrf-test-utils = { workspace = true }

[features]
# Emits TypeScript mirrors and command bindings. Nothing in a normal build turns this on.
typescript-bindings = [
  "specta",
  "specta-typescript",
  "tauri-specta",
  "xrf-engine-target/typescript-bindings",
  "xrf-env-flags/typescript-bindings",
  "xrf-error/typescript-bindings",
  "xrf-ipc-typescript",
  "xrf-job/typescript-bindings",
  "xrf-vfs/typescript-bindings",
]
# Test helpers the plugin crates' tests build on: reading a session's inputs and naming handles.
fixtures = []

[lints]
workspace = true
