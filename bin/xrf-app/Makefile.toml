[tasks.setup]
cwd = "../xrf-ui"
script = "pnpm install --frozen-lockfile"

[tasks.doc]
command = "cargo"
args = ["doc"]

[tasks.build-ui]
cwd = "../xrf-ui"
script = "pnpm run build"

[tasks.build]
env = { XRF_BUILD_KIND = "development" }
command = "cargo"
args = ["tauri", "build", "--debug"]

[tasks.build-release]
env = { XRF_BUILD_KIND = "optimized" }
command = "cargo"
args = ["tauri", "build"]
dependencies = ["setup"]

[tasks.dev]
command = "cargo"
args = ["tauri", "dev"]

[tasks.dev-optimized]
extend = "dev"
env = { CARGO_PROFILE_DEV_OPT_LEVEL = "1" }

[tasks.serve-backend]
command = "cargo"
args = ["run", "--no-default-features"]

[tasks.serve-ui]
cwd = "../xrf-ui"
script = "pnpm run dev"
