[tasks.setup]
cwd = "../xrf-ui"
script = "pnpm install --frozen-lockfile"

[tasks.doc]
command = "cargo"
args = ["doc"]

[tasks.build-ui]
cwd = "../xrf-ui"
script = "pnpm run build"

[tasks.build]
command = "cargo"
args = ["tauri", "build", "--debug"]

[tasks.build-release]
command = "cargo"
args = ["tauri", "build"]
dependencies = ["setup"]

[tasks.dev]
command = "cargo"
args = ["tauri", "dev"]

[tasks.serve-backend]
command = "cargo"
args = ["run", "--no-default-features"]

[tasks.serve-ui]
cwd = "../xrf-ui"
script = "pnpm run dev"
