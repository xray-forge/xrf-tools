[package]
name = "xrf-cli"
version = "0.1.0"
publish = false
edition = "2024"
rust-version.workspace = true

[build-dependencies]
xrf-build-info = { workspace = true }
# Embeds the Windows icon resource. Already in the tree by way of `tauri-build`, and a no-op off Windows.
embed-resource = "3.0.6"

[dependencies]
xrf-build-info = { workspace = true }
# `string` accepts owned values for the builder, which the version text is - it is composed at runtime.
clap = { version = "4.6.6", features = ["derive", "default", "string"] }
colored = "3.1.1"
env_logger = { workspace = true }
log = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
walkdir = { workspace = true }
sysinfo = { workspace = true }
xrf-archive = { workspace = true }
xrf-vfs = { workspace = true }
xrf-db = { workspace = true }
xrf-dds = { workspace = true }
xrf-dialog = { workspace = true }
xrf-gamedata = { workspace = true }
xrf-ltx = { workspace = true }
xrf-output = { workspace = true }
xrf-report = { workspace = true }
xrf-error = { workspace = true }
xrf-job = { workspace = true, features = ["rayon"] }
xrf-export = { workspace = true }
xrf-texture = { workspace = true }
xrf-translation = { workspace = true }
xrf-utils = { workspace = true }
xrf-visual = { workspace = true }
xrf-pack = { workspace = true }

[dev-dependencies]
xrf-test-utils = { workspace = true }

[lints]
workspace = true
