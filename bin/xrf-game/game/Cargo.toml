[package]
name = "xrf-game"
version = "0.1.0"
publish = false
description = "XRF game: the native game binary"
authors = ["Neloreck"]
edition.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "xrf-game"
path = "src/main.rs"

[features]
default = ["dlss", "mcp"]
# NVIDIA DLSS through the renderer, its SDK fetched into `.sdks` by `cargo make fetch-sdks`; a GPU without it resolves
# with FSR instead.
dlss = ["xrf-renderer/dlss"]
# The control endpoint agents drive the game through, started only by `--mcp`.
mcp = ["dep:image", "dep:serde_json", "dep:xrf-game-mcp", "dep:xrf-utils"]

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
image = { workspace = true, features = ["png"], optional = true }
log = { workspace = true }
serde_json = { workspace = true, optional = true }
rayon = "1.12.0"
xrf-audio = { workspace = true, features = ["steam-audio"] }
xrf-cache = { workspace = true }
xrf-chunk = { workspace = true }
xrf-directories = { workspace = true }
xrf-dltx = { workspace = true }
xrf-engine-target = { workspace = true }
xrf-error = { workspace = true }
xrf-gamemtl = { workspace = true }
xrf-game-alife = { workspace = true }
xrf-game-developer = { workspace = true }
xrf-game-graph = { workspace = true }
xrf-game-loop = { workspace = true }
xrf-game-mcp = { workspace = true, optional = true }
xrf-game-movement = { workspace = true }
xrf-game-objects = { workspace = true }
xrf-game-platform = { workspace = true }
xrf-game-settings = { workspace = true }
xrf-game-simulation = { workspace = true }
xrf-job = { workspace = true }
xrf-level = { workspace = true }
xrf-level-source = { workspace = true }
xrf-logging = { workspace = true }
xrf-ltx = { workspace = true }
xrf-ltx-project = { workspace = true }
xrf-math = { workspace = true }
xrf-physics = { workspace = true }
xrf-renderer = { workspace = true }
xrf-renderer-host = { workspace = true }
xrf-session = { workspace = true }
xrf-spawn = { workspace = true }
xrf-utils = { workspace = true, optional = true }
xrf-vfs = { workspace = true }
xrf-world = { workspace = true }

[lints]
workspace = true
