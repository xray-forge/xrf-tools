[package]
name = "xrf-game"
version = "0.1.0"
publish = false
description = "XRF game: the native game binary"
authors = ["Neloreck"]
edition.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "xrf-game"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
log = { workspace = true }
rayon = "1.12.0"
xrf-audio = { workspace = true, features = ["steam-audio"] }
xrf-cache = { workspace = true }
xrf-directories = { workspace = true }
xrf-dltx = { workspace = true }
xrf-engine-target = { workspace = true }
xrf-error = { workspace = true }
xrf-game-loop = { workspace = true }
xrf-game-movement = { workspace = true }
xrf-game-platform = { workspace = true }
xrf-game-settings = { workspace = true }
xrf-job = { workspace = true }
xrf-level-source = { workspace = true }
xrf-logging = { workspace = true }
xrf-ltx = { workspace = true }
xrf-math = { workspace = true }
xrf-renderer = { workspace = true }
xrf-renderer-host = { workspace = true }
xrf-session = { workspace = true }
xrf-vfs = { workspace = true }
xrf-world = { workspace = true }

[lints]
workspace = true
