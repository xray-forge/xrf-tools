# `intel_tex_2` (pulled in by `image_dds` for BCn/ASTC encoding) links a prebuilt C++ static archive
# but never emits `cargo:rustc-link-lib=stdc++`, so `__gxx_personality_v0` stays undefined.
# GNU ld collected the reference with `--gc-sections`; rust-lld (default linker on
# x86_64-unknown-linux-gnu since Rust 1.90) keeps `.eh_frame` live and reports it as an error.
[target.'cfg(all(target_os = "linux", target_env = "gnu"))']
rustflags = ["-Clink-arg=-lstdc++"]

# Steam Audio is loaded when the audio starts rather than when a binary does, so one without it plays dry: on Windows
# its library is delay-loaded, which every binary linking it needs, hence here rather than in a build script. Media
# Foundation's libraries are delayed the same way, which the `windows` crate's raw-dylib imports take, so a Windows
# without them (an N edition lacking the Media Feature Pack) still starts the app and only video is refused. A binary
# importing nothing of a library is told so by the linker (LNK4199), which is no fault.
[target.'cfg(windows)']
rustflags = [
  "-Clink-arg=/DELAYLOAD:phonon.dll",
  "-Clink-arg=/DELAYLOAD:mfplat.dll",
  "-Clink-arg=/DELAYLOAD:mfreadwrite.dll",
  "-Clink-arg=/DELAYLOAD:mf.dll",
  "-Clink-arg=delayimp.lib",
  "-Clink-arg=/IGNORE:4199",
]

# On macOS it is linked weakly, found beside the executable in the application's resources or in the checkout's
# `.sdks` for a development build.
[target.'cfg(target_os = "macos")']
rustflags = [
  "-Clink-arg=-Wl,-weak-lphonon",
  "-Clink-arg=-Wl,-rpath,@executable_path/../Resources/resources/audio/steam-audio",
  "-Clink-arg=-Wl,-rpath,@executable_path/../../.sdks/steam-audio",
]

# The SDKs `cargo make fetch-sdks` places; any set in the environment wins. bindgen loads libclang from
# `.sdks/libclang`: the fetched one on Windows, a link to the system's elsewhere.
[env]
DLSS_SDK = { value = ".sdks/dlss", relative = true }
VULKAN_SDK = { value = ".sdks/vulkan-headers", relative = true }
LIBCLANG_PATH = { value = ".sdks/libclang", relative = true }
STEAMAUDIO_LIB_DIR = { value = ".sdks/steam-audio", relative = true }
