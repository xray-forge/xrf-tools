[package]
name = "xrf-renderer"
version = "0.1.0"
publish = false
edition.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
bytemuck = { workspace = true }
glam = { workspace = true }
image = { workspace = true, features = ["png"] }
log = { workspace = true }
pollster = { workspace = true }
raw-window-handle = { workspace = true }
rayon = { workspace = true }
serde = { workspace = true }
specta = { workspace = true, optional = true }
wgpu = { workspace = true }
xrf-dds = { workspace = true }
xrf-engine-target = { workspace = true }
xrf-environment = { workspace = true }
xrf-error = { workspace = true }
xrf-material = { workspace = true }
xrf-math = { workspace = true }
xrf-particles = { workspace = true }
xrf-visual = { workspace = true }

[dev-dependencies]
naga = { workspace = true }
serde_json = { workspace = true }

[features]
# Emits TypeScript mirrors of the serialized types. Nothing in a normal build turns this on.
typescript-bindings = [
  "specta",
  "xrf-environment/typescript-bindings",
  "xrf-engine-target/typescript-bindings",
  "xrf-visual/typescript-bindings",
]

[lints]
workspace = true
