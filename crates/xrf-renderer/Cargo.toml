[package]
name = "xrf-renderer"
version = "0.1.0"
publish = false
edition.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
bytemuck = { workspace = true }
glam = { workspace = true }
log = { workspace = true }
pollster = { workspace = true }
raw-window-handle = { workspace = true }
rayon = { workspace = true }
serde = { workspace = true }
specta = { workspace = true, optional = true }
wgpu = { workspace = true }
xrf-dds = { workspace = true }
xrf-error = { workspace = true }
xrf-material = { workspace = true }
xrf-math = { workspace = true }
xrf-visual = { workspace = true }

[dev-dependencies]
naga = { workspace = true }

[features]
# Emits TypeScript mirrors of the serialized types. Nothing in a normal build turns this on.
typescript-bindings = ["specta"]

[lints]
workspace = true
