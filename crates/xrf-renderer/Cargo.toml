[package]
name = "xrf-renderer"
version = "0.1.0"
publish = false
edition.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
ash = { workspace = true }
bytemuck = { workspace = true }
glam = { workspace = true }
image = { workspace = true, features = ["png"] }
log = { workspace = true }
notify = { workspace = true }
pollster = { workspace = true }
profiling = { workspace = true }
raw-window-handle = "0.6.2"
rayon = { workspace = true }
serde = { workspace = true }
specta = { workspace = true, optional = true }
wgpu = { workspace = true }
xrf-anm = { workspace = true }
xrf-dds = { workspace = true }
xrf-dlss = { workspace = true }
xrf-engine-target = { workspace = true }
xrf-environment = { workspace = true }
xrf-error = { workspace = true }
xrf-material = { workspace = true }
xrf-math = { workspace = true }
xrf-particles = { workspace = true }
xrf-renderer-core = { workspace = true }
xrf-utils = { workspace = true }
xrf-visual = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_Graphics_Dxgi"] }

[dev-dependencies]
naga = { workspace = true }
serde_json = { workspace = true }

[features]
# Emits TypeScript mirrors of the serialized types. Nothing in a normal build turns this on.
typescript-bindings = [
  "specta",
  "xrf-environment/typescript-bindings",
  "xrf-engine-target/typescript-bindings",
  "xrf-visual/typescript-bindings",
]
# Zones, GPU zones and frame marks for a Tracy capture.
tracy = ["xrf-renderer-core/tracy"]
# Upscales with NVIDIA DLSS on Vulkan and D3D12, built against its SDK as DEVELOPMENT.md sets it up.
dlss = ["xrf-dlss/sdk"]

[lints]
workspace = true
