[package]
name = "xrf-math"
version = "0.1.0"
publish = false
edition.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
byteorder = { workspace = true }
derive_more = { workspace = true, features = ["display", "from_str"] }
serde = { workspace = true }
specta = { workspace = true, optional = true }
xrf-chunk = { workspace = true }
xrf-error = { workspace = true }

[features]
# Emits TypeScript mirrors of the serialized types. Nothing in a normal build turns this on.
typescript-bindings = ["specta"]
# Exports the mock values this crate's own tests use, so a dependant tests against the same shapes.
fixtures = []

[dev-dependencies]
serde_json = { workspace = true }
xrf-test-utils = { workspace = true }

[lints]
workspace = true
