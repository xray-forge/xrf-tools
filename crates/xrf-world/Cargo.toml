[package]
name = "xrf-world"
version = "0.1.0"
publish = false
edition.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
glam = { workspace = true }
log = { workspace = true }
serde = { workspace = true }
specta = { workspace = true, optional = true }
xrf-anm = { workspace = true }
xrf-engine-target = { workspace = true }
xrf-environment = { workspace = true }
xrf-error = { workspace = true }
xrf-math = { workspace = true }
xrf-particles = { workspace = true }
xrf-renderer = { workspace = true }
xrf-renderer-core = { workspace = true }
xrf-visual = { workspace = true }

[dev-dependencies]
rayon = { workspace = true }
xrf-animation-envelope = { workspace = true }
xrf-material = { workspace = true }

[features]
# Emits TypeScript mirrors of the serialized types. Nothing in a normal build turns this on.
typescript-bindings = ["specta", "xrf-environment/typescript-bindings", "xrf-renderer/typescript-bindings"]

[lints]
workspace = true
