[package]
name = "xrf-job"
version = "0.1.0"
publish = false
edition.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
log = { workspace = true }
rayon = { workspace = true }
serde = { workspace = true }
specta = { workspace = true, optional = true }
xrf-error = { workspace = true }
xrf-utils = { workspace = true }

# The process's affinity, which the standard library's processor count ignores on Windows.
[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_Foundation", "Win32_System_Threading"] }

[dev-dependencies]
criterion = { workspace = true }
serde_json = { workspace = true }

[[bench]]
name = "advance"
harness = false

[features]
# Pools for tests: small, named, and built here like every other pool. Enabled from consumers' dev-dependencies.
testing = []
# Emits TypeScript mirrors of the serialized types. Nothing in a normal build turns this on.
typescript-bindings = ["specta"]

[lints]
workspace = true
