[package]
name = "xrf-audio"
version = "0.1.0"
publish = false
edition.workspace = true
rust-version.workspace = true

[dependencies]
cpal = "0.18.2"
log = { workspace = true }
rtrb = "0.4.1"
serde = { workspace = true }
specta = { workspace = true, optional = true }
symphonia = { workspace = true, features = ["ogg", "pcm", "wav"] }
xrf-error = { workspace = true }
xrf-utils = { workspace = true }

[dev-dependencies]
assert_no_alloc = { version = "1.1.2", default-features = false, features = ["warn_debug", "warn_release"] }

[features]
typescript-bindings = ["specta"]

[lints]
workspace = true
