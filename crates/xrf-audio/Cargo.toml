[package]
name = "xrf-audio"
version = "0.1.0"
publish = false
edition.workspace = true
rust-version.workspace = true

[dependencies]
audionimbus = { version = "0.16.2", default-features = false, optional = true }
cpal = "0.18.2"
log = { workspace = true }
rtrb = "0.4.1"
serde = { workspace = true }
specta = { workspace = true, optional = true }
symphonia = { workspace = true, features = ["pcm", "wav"] }
xrf-audio-scene = { workspace = true }
xrf-error = { workspace = true }
xrf-sound = { workspace = true }
xrf-utils = { workspace = true }

[dev-dependencies]
assert_no_alloc = { version = "1.1.2", default-features = false, features = ["warn_debug", "warn_release"] }
xrf-sound = { workspace = true, features = ["fixtures"] }
xrf-test-utils = { workspace = true }

[features]
# Acoustics through Steam Audio, linked as `.cargo/config.toml` sets it up and loaded when the audio starts; without it,
# or where the library does not load, sound plays dry.
steam-audio = ["dep:audionimbus"]
typescript-bindings = ["specta", "xrf-audio-scene/typescript-bindings"]

[lints]
workspace = true
