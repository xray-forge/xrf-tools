[package]
name = "xrf-dialog"
version = "0.1.0"
publish = false
edition = "2024"
rust-version.workspace = true

[dependencies]
indexmap = { workspace = true }
log = { workspace = true }
serde = { workspace = true }
specta = { workspace = true, optional = true, features = ["indexmap"] }
xrf-error = { workspace = true }
xrf-translation = { workspace = true }
xrf-utils = { workspace = true }
xrf-vfs = { workspace = true }
xrf-xml = { workspace = true }

[features]
# Emits TypeScript mirrors of the serialized types. Nothing in a normal build turns this on.
typescript-bindings = ["specta", "xrf-translation/typescript-bindings", "xrf-vfs/typescript-bindings"]

[dev-dependencies]
serde_json = { workspace = true }
xrf-test-utils = { workspace = true }

[lints]
workspace = true
