[package]
name = "xrf-ltx-project"
version = "0.1.0"
publish = false
edition.workspace = true
rust-version.workspace = true
license = "MIT"

[lib]
path = "src/lib.rs"

[dependencies]
indexmap = { workspace = true }
rustc-hash = { workspace = true }
serde = { workspace = true }
specta = { workspace = true, optional = true }
xrf-error = { workspace = true }
xrf-job = { workspace = true }
xrf-ltx = { workspace = true }
xrf-output = { workspace = true }
xrf-profiler = { workspace = true }
xrf-utils = { workspace = true }
xrf-vfs = { workspace = true }

[dev-dependencies]
xrf-test-utils = { workspace = true }

[features]
# Emits TypeScript mirrors of the serialized types. Nothing in a normal build turns this on.
typescript-bindings = ["specta", "xrf-job/typescript-bindings"]

[lints]
workspace = true
