[package]
name = "xrf-environment"
version = "0.1.0"
publish = false
edition.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
serde = { workspace = true }
specta = { workspace = true, optional = true }
xrf-engine-target = { workspace = true }
xrf-error = { workspace = true }
xrf-extension = { workspace = true }
xrf-job = { workspace = true }
xrf-ltx = { workspace = true }
xrf-math = { workspace = true }
xrf-vfs = { workspace = true }

[dev-dependencies]
xrf-dltx = { workspace = true }
xrf-test-utils = { workspace = true }

[features]
# Emits TypeScript mirrors of the serialized types. Nothing in a normal build turns this on.
typescript-bindings = ["specta", "xrf-engine-target/typescript-bindings"]

[lints]
workspace = true
