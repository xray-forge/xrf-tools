[package]
name = "xrf-spawn"
version = "0.1.0"
publish = false
edition.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
log = { workspace = true }
serde = { workspace = true }
specta = { workspace = true, optional = true }
uuid = { workspace = true, features = ["v4", "serde"] }
xrf-chunk = { workspace = true }
xrf-enum-derive = { workspace = true }
xrf-error = { workspace = true }
xrf-ltx = { workspace = true }
xrf-math = { workspace = true }
xrf-utils = { workspace = true }

[features]
# The objects' `new_mock` constructors, for other crates' tests. Nothing in a normal build turns this on.
mocks = []
# Emits TypeScript mirrors of the serialized types. Nothing in a normal build turns this on.
typescript-bindings = ["specta", "xrf-math/typescript-bindings"]

[dev-dependencies]
serde_json = { workspace = true }
# A mod's configs, read as the game reads them where a caller picks the patch dialect.
xrf-dltx = { workspace = true }
xrf-math = { workspace = true, features = ["fixtures"] }
xrf-test-utils = { workspace = true }
xrf-utils = { workspace = true, features = ["staging-faults"] }

[lints]
workspace = true
