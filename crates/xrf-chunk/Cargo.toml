[package]
name = "xrf-chunk"
version = "0.1.0"
publish = false
edition.workspace = true
rust-version.workspace = true

[dependencies]
fileslice = { workspace = true }
xrf-error = { workspace = true }
xrf-utils = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
xrf-test-utils = { workspace = true }

# Throughput of the reader every binary format sits on; a regression here reaches all of them.
[[bench]]
name = "chunk_reading"
harness = false

# Framing on the way out, which every format writer and repack goes through.
[[bench]]
name = "chunk_writing"
harness = false

# Numbers, strings and typed records read and written through a chunk, as bytes and as fields.
[[bench]]
name = "chunk_fields"
harness = false

[lints]
workspace = true
