[package]
name = "xrf-translation"
version = "0.1.0"
publish = false
edition = "2024"
rust-version.workspace = true

[dependencies]
derive_more = { workspace = true, features = ["display", "from_str"] }
indexmap = { workspace = true }
log = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
specta = { workspace = true, optional = true, features = ["indexmap"] }
walkdir = { workspace = true }
xrf-error = { workspace = true }
xrf-output = { workspace = true }
xrf-report = { workspace = true }
xrf-utils = { workspace = true }
xrf-vfs = { workspace = true }
xrf-xml = { workspace = true }

[features]
# Emits TypeScript mirrors of the serialized types. Nothing in a normal build turns this on.
typescript-bindings = ["specta", "xrf-vfs/typescript-bindings"]

[dev-dependencies]
xrf-test-utils = { workspace = true }

[lints]
workspace = true
