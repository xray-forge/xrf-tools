[package]
name = "xrf-profiler"
version = "0.1.0"
publish = false
edition.workspace = true
rust-version.workspace = true

[dependencies]
profiling = { workspace = true }
# Tracy 0.14's protocol, which the workspace's Tracy tools speak and whose exporter reads GPU zones; the `-sys` crate is a
# direct dependency only to pin it.
tracy-client = { version = "=0.18.5", optional = true }
tracy-client-sys = { version = "=0.29.0", optional = true }

[features]
# Every `profiling` scope in the build becomes a Tracy zone, streamed to a client this crate starts. Only the `tracy`
# build profile turns it on.
tracy = ["profiling/profile-with-tracy", "dep:tracy-client", "dep:tracy-client-sys"]
# Every allocation and free goes to the capture too, with its call stack: costly, for finding what holds memory.
tracy-memory = ["tracy"]

[lints]
workspace = true
