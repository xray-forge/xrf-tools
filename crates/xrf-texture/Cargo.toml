[package]
name = "xrf-texture"
version = "0.1.0"
publish = false
edition = "2024"
rust-version.workspace = true

[dependencies]
image = { workspace = true, features = [
  "rayon", "bmp", "dds", "exr", "ff", "gif", "hdr", "ico", "jpeg", "png", "pnm", "qoi", "tga", "tiff", "webp",
] }
log = { workspace = true }
rayon = { workspace = true }
serde = { workspace = true }
specta = { workspace = true, optional = true }
xrf-dds = { workspace = true }
xrf-error = { workspace = true }
xrf-ltx = { workspace = true }
xrf-output = { workspace = true }
xrf-utils = { workspace = true }
xrf-vfs = { workspace = true }
xrf-xml = { workspace = true }

[dev-dependencies]
xrf-test-utils = { workspace = true }

[features]
# Emits TypeScript mirrors of the serialized types. Nothing in a normal build turns this on.
typescript-bindings = ["specta"]

[lints]
workspace = true
