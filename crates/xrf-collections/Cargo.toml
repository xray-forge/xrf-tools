[package]
name = "xrf-collections"
version = "0.1.0"
publish = false
edition.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"

# This crate's alone: every other crate takes its maps, sets and queues from `xrf_collections`, so the hasher and the
# versions have one owner.
[dependencies]
hashbrown = { version = "0.17.1", default-features = false }
indexmap = { version = "2.14.2", features = ["serde"] }
rtrb = "0.4.1"
rustc-hash = "2.1.3"

[lints]
workspace = true
