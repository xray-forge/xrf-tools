[package]
name = "xrf-vfs"
version = "0.1.0"
publish = false
edition = "2024"
rust-version.workspace = true

[dependencies]
log = { workspace = true }
serde = { workspace = true }
specta = { workspace = true, optional = true }
walkdir = { workspace = true }
xrf-archive = { workspace = true }
xrf-error = { workspace = true }
xrf-utils = { workspace = true }

[features]
# Emits TypeScript mirrors of the serialized types. Nothing in a normal build turns this on.
typescript-bindings = ["specta"]

# Guards the allocation-free fast path in `normalize`, which every read and every enumerated entry pays.
[[bench]]
name = "path_normalization"
harness = false

[lints]
workspace = true

[dev-dependencies]
criterion = { workspace = true }
serde_json = { workspace = true }
xrf-test-utils = { workspace = true }
