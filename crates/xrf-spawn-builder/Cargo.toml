[package]
name = "xrf-spawn-builder"
version = "0.1.0"
publish = false
edition.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
glam = { workspace = true }
rayon = { workspace = true }
serde = { workspace = true }
sha2 = { workspace = true }
specta = { workspace = true, optional = true }
uuid = { workspace = true }
xrf-chunk = { workspace = true }
xrf-error = { workspace = true }
xrf-geometry = { workspace = true }
xrf-job = { workspace = true }
xrf-level = { workspace = true }
xrf-ltx = { workspace = true }
xrf-math = { workspace = true, features = ["glam"] }
xrf-report = { workspace = true }
xrf-spawn = { workspace = true }
xrf-utils = { workspace = true }

[dev-dependencies]
xrf-spawn = { workspace = true, features = ["mocks"] }
xrf-test-utils = { workspace = true }

[features]
# Emits TypeScript mirrors of the build's request, its outcome and the levels it lists. Nothing in a normal build turns
# this on.
typescript-bindings = ["specta", "xrf-report/typescript-bindings"]

[lints]
workspace = true
