[package]
name = "xrf-visual"
version = "0.1.0"
publish = false
edition.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
byteorder = { workspace = true }
log = { workspace = true }
serde = { workspace = true }
specta = { workspace = true, optional = true }
xrf-math = { workspace = true }
xrf-ogf = { workspace = true }
xrf-skeleton = { workspace = true }
xrf-chunk = { workspace = true }
xrf-error = { workspace = true }
xrf-level = { workspace = true }
xrf-vfs = { workspace = true }
xrf-spawn = { workspace = true }
xrf-light-anim = { workspace = true }
xrf-ltx = { workspace = true }
xrf-particles = { workspace = true }

[features]
# Emits TypeScript mirrors of the serialized types. Nothing in a normal build turns this on.
typescript-bindings = ["specta", "xrf-math/typescript-bindings", "xrf-vfs/typescript-bindings"]

[lints]
workspace = true

[dev-dependencies]
xrf-test-utils = { workspace = true }
