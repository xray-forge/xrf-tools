[package]
name = "xrf-level"
version = "0.1.0"
publish = false
edition.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
glam = { workspace = true }
serde = { workspace = true }
uuid = { workspace = true, features = ["v4", "serde"] }
specta = { workspace = true, optional = true }
xrf-chunk = { workspace = true }
xrf-error = { workspace = true }
xrf-geometry = { workspace = true }
xrf-job = { workspace = true }
xrf-math = { workspace = true, features = ["glam"] }
xrf-ogf = { workspace = true }
xrf-report = { workspace = true }
xrf-utils = { workspace = true }

[features]
# Emits TypeScript mirrors of the serialized types. Nothing in a normal build turns this on.
typescript-bindings = ["specta", "xrf-math/typescript-bindings"]

[dev-dependencies]
criterion = { workspace = true }
xrf-test-utils = { workspace = true }

# The collision form is the largest array a level open decodes; `XRF_BENCH_CORPUS` adds real `level.cform` files.
[[bench]]
name = "cform_reading"
harness = false

[lints]
workspace = true
