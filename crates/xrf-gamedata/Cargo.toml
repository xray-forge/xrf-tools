[package]
name = "xrf-gamedata"
version = "0.1.0"
publish = false
edition.workspace = true
rust-version.workspace = true

[dependencies]
derive_more = { workspace = true, features = ["display"] }
rayon = { workspace = true }
serde = { workspace = true }
specta = { workspace = true, optional = true }
uuid = { workspace = true, features = ["v4"] }
xrf-chunk = { workspace = true }
xrf-math = { workspace = true }
xrf-ogf = { workspace = true }
xrf-dds = { workspace = true }
xrf-engine-target = { workspace = true }
xrf-environment = { workspace = true }
xrf-error = { workspace = true }
xrf-extension = { workspace = true }
xrf-job = { workspace = true }
xrf-level = { workspace = true }
xrf-ltx = { workspace = true }
xrf-lua = { workspace = true }
xrf-material = { workspace = true }
xrf-output = { workspace = true }
xrf-report = { workspace = true }
xrf-vfs = { workspace = true }
xrf-shaders = { workspace = true }
xrf-sound = { workspace = true }
xrf-utils = { workspace = true }
xrf-xml = { workspace = true }
xrf-omf = { workspace = true }
xrf-thm = { workspace = true }
xrf-spawn = { workspace = true }
xrf-particles = { workspace = true }
xrf-animation-envelope = { workspace = true }
xrf-anm = { workspace = true }
xrf-ppe = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
serde_json = { workspace = true }
xrf-material = { workspace = true, features = ["fixtures"] }
xrf-test-utils = { workspace = true }

# Measures the pattern rather than the private call site, which is what the decision needs: whether the linear scan is
# expensive at a realistic skeleton size.
[[bench]]
name = "bone_matching"
harness = false

[features]
# Emits TypeScript mirrors of the types a command takes or answers. Nothing in a normal build turns this on.
typescript-bindings = ["specta", "xrf-report/typescript-bindings"]

[lints]
workspace = true
