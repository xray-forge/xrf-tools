[package]
name = "xrf-gamedata"
version = "0.1.0"
publish = false
edition = "2024"
rust-version.workspace = true

[dependencies]
derive_more = { workspace = true, features = ["display"] }
rayon = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
xrf-chunk = { workspace = true }
xrf-db = { workspace = true }
xrf-dds = { workspace = true }
xrf-error = { workspace = true }
xrf-job = { workspace = true }
xrf-ltx = { workspace = true }
xrf-lua = { workspace = true }
xrf-output = { workspace = true }
xrf-report = { workspace = true }
xrf-vfs = { workspace = true }
xrf-shaders = { workspace = true }
xrf-sound = { workspace = true }
xrf-utils = { workspace = true }
xrf-xml = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
xrf-test-utils = { workspace = true }

# Measures the pattern rather than the private call site, which is what the decision needs: whether the linear scan is
# expensive at a realistic skeleton size.
[[bench]]
name = "bone_matching"
harness = false

[lints]
workspace = true
