[package]
name = "xrf-renderer-host"
version = "0.1.0"
publish = false
edition.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
log = { workspace = true }
xrf-cache = { workspace = true }
xrf-error = { workspace = true }
xrf-material = { workspace = true }
xrf-renderer = { workspace = true }
xrf-vfs = { workspace = true }

[dev-dependencies]
xrf-test-utils = { workspace = true }

# The window's client area and instance, which native viewports draw their surface over.
[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

# The view a macOS window's native viewports are drawn in.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
  "std",
  "NSGraphics",
  "NSResponder",
  "NSView",
  "NSWindow",
  "objc2-quartz-core",
] }
# Walks a view's subviews.
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSEnumerator"] }
objc2-quartz-core = { version = "0.3.2", default-features = false, features = [
  "std",
  "CALayer",
  "CAMetalLayer",
  "objc2-core-foundation",
] }

[lints]
workspace = true
