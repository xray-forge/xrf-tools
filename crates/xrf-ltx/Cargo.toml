[package]
name = "xrf-ltx"
version = "0.1.0"
publish = false
edition = "2024"
rust-version.workspace = true
license = "MIT"

[lib]
path = "src/lib.rs"

[dependencies]
fxhash = "0.2.1"
indexmap = "2.14.0"
serde = { workspace = true }
specta = { workspace = true, optional = true }
walkdir = { workspace = true }
xrf-vfs = { workspace = true }
xrf-error = { workspace = true }
xrf-utils = { workspace = true }
xrf-output = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
xrf-test-utils = { workspace = true }

[features]
# Emits TypeScript mirrors of the serialized types. Nothing in a normal build turns this on.
typescript-bindings = ["specta", "xrf-error/typescript-bindings"]

# Throughput of the character-at-a-time parser, which the profile put at 614ms of an 11,965ms Anomaly sweep.
[[bench]]
name = "ltx_parsing"
harness = false

[lints]
workspace = true
