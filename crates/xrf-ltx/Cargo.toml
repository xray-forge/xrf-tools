[package]
name = "xrf-ltx"
version = "0.1.0"
publish = false
edition.workspace = true
rust-version.workspace = true
license = "MIT"

[lib]
path = "src/lib.rs"

[dependencies]
hashbrown = { version = "0.17.1", default-features = false }
indexmap = { workspace = true }
rustc-hash = { workspace = true }
xrf-error = { workspace = true }
xrf-extension = { workspace = true }
xrf-utils = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
xrf-test-utils = { workspace = true }
xrf-utils = { workspace = true, features = ["staging-faults"] }

# Throughput of the character-at-a-time parser, which the profile put at 614ms of an 11,965ms Anomaly sweep.
[[bench]]
name = "ltx_parsing"
harness = false

[lints]
workspace = true
