[package]
name = "xrf-session"
version = "0.1.0"
publish = false
edition.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
serde = { workspace = true }
specta = { workspace = true, optional = true }
uuid = { workspace = true, features = ["serde", "v4"] }
xrf-job = { workspace = true }
xrf-vfs = { workspace = true }

[features]
# Emits TypeScript mirrors of the serialized types. Nothing in a normal build turns this on.
typescript-bindings = ["specta", "xrf-vfs/typescript-bindings"]
# Test helpers a host's tests build on: the inputs a part was built from.
fixtures = []

[lints]
workspace = true
