[package]
name = "xrf-renderer-core"
version = "0.1.0"
publish = false
edition.workspace = true
rust-version.workspace = true

[dependencies]
bytemuck = { workspace = true }
crc32fast = { workspace = true }
glam = { workspace = true }
log = { workspace = true }
naga = { workspace = true }
offset-allocator = "0.2.0"
pollster = { workspace = true }
profiling = { workspace = true }
rayon = { workspace = true }
serde = { workspace = true }
# The GPU zones' context; xrf-profiler pins the version and starts the client.
tracy-client = { version = "=0.18.5", optional = true }
wgpu = { workspace = true }
xrf-error = { workspace = true }
xrf-profiler = { workspace = true, optional = true }
xrf-renderer-derive = { workspace = true }

[dev-dependencies]
xrf-test-utils = { workspace = true }
serde_json = { workspace = true }

[features]
# GPU zones beside every crate's zones in a Tracy capture; only the `tracy` build profile turns it on.
tracy = ["xrf-profiler/tracy", "dep:tracy-client"]

[lints]
workspace = true
