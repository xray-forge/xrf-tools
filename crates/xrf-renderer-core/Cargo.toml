[package]
name = "xrf-renderer-core"
version = "0.1.0"
publish = false
edition.workspace = true
rust-version.workspace = true

[dependencies]
bytemuck = { workspace = true }
glam = { workspace = true }
naga = { workspace = true }
offset-allocator = "0.2.0"
pollster = { workspace = true }
profiling = { workspace = true }
rayon = { workspace = true }
serde = { workspace = true }
# Tracy 0.14's protocol, which the workspace's Tracy tools speak and whose exporter reads GPU zones; the `-sys` crate is a
# direct dependency only to pin it.
tracy-client = { version = "=0.18.5", optional = true }
tracy-client-sys = { version = "=0.29.0", optional = true }
wgpu = { workspace = true }
xrf-error = { workspace = true }
xrf-renderer-derive = { workspace = true }

[dev-dependencies]
xrf-test-utils = { workspace = true }
serde_json = { workspace = true }

[features]
# Zones, GPU zones and frame marks for a Tracy capture; only the `tracy` build profile turns it on.
tracy = ["profiling/profile-with-tracy", "dep:tracy-client", "dep:tracy-client-sys"]

[lints]
workspace = true
