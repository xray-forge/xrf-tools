[package]
name = "xrf-renderer-core"
version = "0.1.0"
publish = false
edition.workspace = true
rust-version.workspace = true

[dependencies]
bytemuck = { workspace = true }
crc32fast = { workspace = true }
log = { workspace = true }
naga = { workspace = true }
offset-allocator = "0.2.0"
pollster = { workspace = true }
serde = { workspace = true }
specta = { workspace = true, optional = true }
wgpu = { workspace = true }
xrf-error = { workspace = true }
xrf-job = { workspace = true }
xrf-math = { workspace = true }
xrf-profiler = { workspace = true }
xrf-renderer-derive = { workspace = true }

[dev-dependencies]
xrf-test-utils = { workspace = true }
serde_json = { workspace = true }

[features]
# Emits TypeScript mirrors of the serialized types. Nothing in a normal build turns this on.
typescript-bindings = ["specta"]

[lints]
workspace = true
