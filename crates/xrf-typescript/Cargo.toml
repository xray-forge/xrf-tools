[package]
name = "xrf-typescript"
version = "0.1.0"
publish = false
edition = "2024"
rust-version.workspace = true

[dependencies]
log = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
swc_common = "25.0.0"
swc_ecma_ast = "28.0.0"
swc_ecma_codegen = { version = "31.0.0", optional = true }
swc_ecma_parser = "44.0.0"
xrf-error = { workspace = true }
xrf-utils = { workspace = true }

[dev-dependencies]
xrf-test-utils = { workspace = true }

[features]
# Canonical rendering of parsed TypeScript. Off by default so the CLI, which reaches this crate
# through xrf-export, never compiles the emitter or the visitor tree behind it.
codegen = ["swc_ecma_codegen"]

[lints]
workspace = true
