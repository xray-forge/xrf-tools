[package]
name = "xrf-archive-stats"
version = "0.1.0"
publish = false
edition.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
serde = { workspace = true }
specta = { workspace = true, optional = true }
xrf-archive = { workspace = true }
xrf-extension = { workspace = true }
xrf-vfs = { workspace = true }

[features]
typescript-bindings = [
  "specta",
  "xrf-archive/typescript-bindings",
  "xrf-extension/typescript-bindings",
  "xrf-vfs/typescript-bindings",
]

[lints]
workspace = true
