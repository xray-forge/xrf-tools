[package]
name = "xrf-ltx-inspect"
version = "0.1.0"
publish = false
edition.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
serde = { workspace = true }
specta = { workspace = true, optional = true }
xrf-error = { workspace = true }
xrf-ltx = { workspace = true }
xrf-vfs = { workspace = true }

[features]
# Emits TypeScript mirrors of the serialized types. Nothing in a normal build turns this on.
typescript-bindings = ["specta", "xrf-ltx/typescript-bindings", "xrf-vfs/typescript-bindings"]

[lints]
workspace = true
