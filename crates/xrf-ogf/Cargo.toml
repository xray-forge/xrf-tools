[package]
name = "xrf-ogf"
version = "0.1.0"
publish = false
edition.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
byteorder = { workspace = true }
log = { workspace = true }
serde = { workspace = true }
xrf-chunk = { workspace = true }
xrf-error = { workspace = true }
xrf-math = { workspace = true }
xrf-skeleton = { workspace = true }
xrf-utils = { workspace = true }

[features]
# Exports the mock values this crate's own tests use, so a dependant tests against the same shapes.
fixtures = ["xrf-skeleton/fixtures"]

[dev-dependencies]
xrf-math = { workspace = true, features = ["fixtures"] }
xrf-skeleton = { workspace = true, features = ["fixtures"] }
xrf-test-utils = { workspace = true }

[lints]
workspace = true
