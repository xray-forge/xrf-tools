[package]
name = "xrf-pack"
version = "0.1.0"
publish = false
edition = "2024"
rust-version.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
crc32fast = "1.5.0"
log = { workspace = true }
lzokay = { workspace = true }
rayon = { workspace = true }
serde = { workspace = true }
specta = { workspace = true, optional = true }
walkdir = { workspace = true }
xrf-archive = { workspace = true }
xrf-error = { workspace = true }
xrf-job = { workspace = true }
xrf-ltx = { workspace = true }
xrf-lzhuf = { workspace = true }
xrf-utils = { workspace = true }

[dev-dependencies]
# Reading a serialized configuration back is how the wire contract's compatibility is checked.
serde_json = { workspace = true }
# Only the pack-then-mount integration test reads volumes back through the VFS.
xrf-test-utils = { workspace = true }
xrf-vfs = { workspace = true }

[features]
# Emits TypeScript mirrors of the serialized types. Nothing in a normal build turns this on.
typescript-bindings = ["specta", "xrf-archive/typescript-bindings", "xrf-job/typescript-bindings"]

[lints]
workspace = true
