[package]
name = "xrf-level-compiler"
version = "0.1.0"
publish = false
edition.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
bytemuck = { workspace = true, optional = true }
glam = { workspace = true }
log = { workspace = true }
pollster = { workspace = true, optional = true }
rayon = { workspace = true }
serde = { workspace = true }
sha2 = { workspace = true }
specta = { workspace = true, optional = true }
uuid = { workspace = true }
xrf-chunk = { workspace = true }
xrf-dds = { workspace = true }
xrf-error = { workspace = true }
xrf-geometry = { workspace = true }
xrf-job = { workspace = true }
xrf-level = { workspace = true }
xrf-math = { workspace = true, features = ["glam"] }
xrf-renderer-core = { workspace = true, optional = true }
xrf-report = { workspace = true }
xrf-shaders = { workspace = true }
xrf-thm = { workspace = true }
xrf-utils = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
xrf-test-utils = { workspace = true }

[features]
# The GPU backend: the detail lighter's shadow rays and the AI map's corner rays traced with hardware ray queries on a
# D3D12 or Vulkan device. Off by default, so a build without it links no graphics code.
gpu = ["dep:bytemuck", "dep:pollster", "dep:xrf-renderer-core"]
# Emits TypeScript mirrors of the request and report. Nothing in a normal build turns this on.
typescript-bindings = [
  "specta",
  "xrf-job/typescript-bindings",
  "xrf-level/typescript-bindings",
  "xrf-report/typescript-bindings",
]

[lints]
workspace = true
