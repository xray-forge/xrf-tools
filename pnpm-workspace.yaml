packages:
  - bin/xrf-ui
  - cli
  - packages/*

# One version for every dependency more than one member declares, as `[workspace.dependencies]` does for the crates.
# A member names it `catalog:`; declaring it with a range of its own is how two copies of three end up in one bundle.
catalog:
  "@eslint/compat": ^2.1.1
  "@jest/globals": ^30.5.1
  "@swc/core": ^1.16.2
  "@swc/jest": ^0.2.39
  "@types/node": ^24.13.4
  "@types/three": ^0.185.4
  "@typescript/native": npm:typescript@^7.0.2
  eslint: ^10.10.0
  jest: ^30.5.1
  jest-environment-jsdom: ^30.5.1
  prettier: ^3.9.6
  three: ^0.186.0
  typescript: npm:@typescript/typescript6@^6.0.2

allowBuilds:
  "@parcel/watcher": true
  "@swc/core": false
  esbuild: true
  unrs-resolver: false

# Minutes a version must have been public before it resolves: a week for a compromised release to be caught.
# Our own libraries are published and consumed together, so they are exempt.
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - "@wirestate/*"

peerDependencyRules:
  allowedVersions:
    # These exact plugin releases use @eslint/compat in xrf-toolchain's lint/eslint.base.mjs.
    "eslint-plugin-import@2.32.0>eslint": "^10.0.0"
    "eslint-plugin-react@7.37.5>eslint": "^10.0.0"
