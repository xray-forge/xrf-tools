name: Native SDKs
description: >
  Restores the SDKs that the `dlss` feature builds against into `.sdks/`, where `.cargo/config.toml` points the build,
  then fetches anything missing. All jobs and workflows share one cache entry keyed on `cli/sdks/fetch.mjs`, which pins
  each SDK, so the key changes only when a pin does.

runs:
  using: composite
  steps:
    - name: Restore the native SDKs
      id: restore
      uses: actions/cache/restore@v6
      with:
        path: .sdks
        key: native-sdks-${{ runner.os }}-${{ hashFiles('cli/sdks/fetch.mjs') }}
        # An entry from older pins still holds every SDK whose pin is unchanged; the fetch step adds the rest.
        restore-keys: native-sdks-${{ runner.os }}-

    # Checks each SDK against its pin and fetches only what is missing or outdated, so an exact hit fetches nothing.
    - name: Fetch the native SDKs
      shell: bash
      run: node cli/sdks/fetch.mjs

    # Saved only from main, which every branch's restore falls back to. About 250 MB before compression.
    - name: Save the native SDKs
      if: ${{ steps.restore.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main' }}
      uses: actions/cache/save@v6
      with:
        path: .sdks
        key: native-sdks-${{ runner.os }}-${{ hashFiles('cli/sdks/fetch.mjs') }}
