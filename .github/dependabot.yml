version: 2

updates:
  - package-ecosystem: rust-toolchain
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cargo-compatible:
        update-types:
          - minor
          - patch
    ignore:
      # `image_dds` re-exports `ddsfile` and requires ^0.5.1, so anything past 0.5 puts two
      # incompatible copies of it in the graph and fails to compile. Patches still come through.
      # Drop this once `image_dds` moves.
      - dependency-name: ddsfile
        update-types:
          - version-update:semver-major
          - version-update:semver-minor

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
