name: Build and test windows

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: windows-latest

    steps:
      - uses: dtolnay/rust-toolchain@1.97.1

      - name: Configure Git line endings
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - uses: actions/checkout@v6
      - uses: Swatinem/rust-cache@v2

      - name: Run formatter
        run: cargo fmt --all -- --check

      - name: Run xray workspace tests
        run: cargo test --verbose --workspace --lib

  build-cli:
    runs-on: windows-latest

    steps:
      - uses: dtolnay/rust-toolchain@1.97.1

      - name: Configure Git line endings
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - uses: actions/checkout@v6
      - uses: Swatinem/rust-cache@v2

      - name: Build CLI
        run: cargo build -p xrf-cli --release --locked

      - name: Upload CLI build artifacts
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          name: xrf-cli
          path: target/release/xrf-cli.exe
          retention-days: 1

  build-app:
    runs-on: windows-latest

    steps:
      - uses: dtolnay/rust-toolchain@1.97.1

      - name: Configure Git line endings
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: bin/xrf-ui/package.json
          run_install: false

      - name: Use Node.js 24.x
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: pnpm
          cache-dependency-path: bin/xrf-ui/pnpm-lock.yaml

      - uses: Swatinem/rust-cache@v2

      - name: Install UI dependencies
        run: pnpm.cmd --dir bin/xrf-ui install --frozen-lockfile

      - name: Regenerate frontend bindings
        run: cargo test -p xrf-app --features typescript-bindings export_typescript_bindings

      - name: Format regenerated frontend bindings
        run: pnpm.cmd --dir bin/xrf-ui run format:bindings

      # The mirrors are committed, so a Rust type can change without them following. Comparing a fresh
      # generation against the tree is what makes the committed output a function of the Rust sources.
      - name: Verify frontend bindings match the Rust sources
        run: |
          git add --intent-to-add -- bin/xrf-ui/src/core/bindings
          git diff --exit-code -- bin/xrf-ui/src/core/bindings

      - name: Typecheck UI
        run: pnpm.cmd --dir bin/xrf-ui typecheck

      - name: Run UI tests
        run: pnpm.cmd --dir bin/xrf-ui test --maxWorkers=100%

      - name: Lint UI
        run: pnpm.cmd --dir bin/xrf-ui lint

      - name: Build UI
        run: pnpm.cmd --dir bin/xrf-ui build

      - name: Build application
        working-directory: bin/xrf-app
        run: ..\xrf-ui\node_modules\.bin\tauri.cmd build --ci --no-bundle --config tauri.ci.conf.json

      - name: Upload application build artifacts
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          name: xrf-app
          path: target/release/xrf-app.exe
          retention-days: 1

  upload-nightly:
    if: ${{ github.ref_name == 'main' && github.event_name != 'pull_request' }}
    needs: [ checks, build-cli, build-app ]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Update nightly tag
        uses: EndBug/latest-tag@latest
        id: update-nightly-tag
        with:
          ref: nightly

      - uses: actions/download-artifact@v8
        with:
          name: xrf-cli

      - name: Publish nightly cli build
        if: ${{ steps.update-nightly-tag.outcome == 'success' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload --clobber nightly xrf-cli.exe

      - uses: actions/download-artifact@v8
        with:
          name: xrf-app

      - name: Publish nightly application build
        if: ${{ steps.update-nightly-tag.outcome == 'success' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload --clobber nightly xrf-app.exe
