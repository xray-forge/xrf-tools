name: Build and test windows

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  XRF_BUILD_KIND: development

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks-rust:
    runs-on: windows-latest

    steps:
      - uses: dtolnay/rust-toolchain@1.97.1

      - name: Configure Git line endings
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - uses: actions/checkout@v6
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Run formatter
        run: cargo fmt --all -- --check

      - name: Run xray workspace tests and verify frontend bindings
        run: cargo test --verbose --workspace --lib --bins --features xrf-app/typescript-bindings

  build-cli:
    runs-on: windows-latest

    steps:
      - uses: dtolnay/rust-toolchain@1.97.1

      - name: Configure Git line endings
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - uses: actions/checkout@v6
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Record the build timestamp
        shell: bash
        run: echo "XRF_BUILD_TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      # Relaxed for turnaround; `build_optimized.yml` builds what the committed profile describes.
      - name: Build CLI
        env:
          CARGO_PROFILE_RELEASE_LTO: thin
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 16
        run: cargo build -p xrf-cli --release --locked

      - name: Name the CLI build as a development artifact
        run: Move-Item target/release/xrf-cli.exe target/release/xrf-cli-dev.exe

      - name: Upload CLI build artifacts
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          name: xrf-cli
          path: target/release/xrf-cli-dev.exe
          retention-days: 1

  check-typescript:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: bin/xrf-ui/package.json
          run_install: false

      - name: Use Node.js 24.x
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: pnpm
          cache-dependency-path: bin/xrf-ui/pnpm-lock.yaml

      - name: Restore frontend tool state
        id: frontend-tools
        uses: actions/cache/restore@v4
        with:
          path: |
            bin/xrf-ui/target/jest-cache
            bin/xrf-ui/target/eslint
            bin/xrf-ui/target/tsconfig.tsbuildinfo
            bin/xrf-ui/target/tsconfig.node.tsbuildinfo
          key: frontend-tools-${{ runner.os }}-${{ hashFiles('bin/xrf-ui/pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            frontend-tools-${{ runner.os }}-${{ hashFiles('bin/xrf-ui/pnpm-lock.yaml') }}-
            frontend-tools-${{ runner.os }}-

      - name: Install UI dependencies
        run: pnpm --dir bin/xrf-ui install --frozen-lockfile

      - name: Typecheck UI
        run: pnpm --dir bin/xrf-ui typecheck

      - name: Run UI tests
        run: pnpm --dir bin/xrf-ui test --maxWorkers=100%

      - name: Lint UI
        run: pnpm --dir bin/xrf-ui lint

      - name: Save frontend tool state
        if: ${{ github.ref == 'refs/heads/main' && steps.frontend-tools.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            bin/xrf-ui/target/jest-cache
            bin/xrf-ui/target/eslint
            bin/xrf-ui/target/tsconfig.tsbuildinfo
            bin/xrf-ui/target/tsconfig.node.tsbuildinfo
          key: frontend-tools-${{ runner.os }}-${{ hashFiles('bin/xrf-ui/pnpm-lock.yaml') }}-${{ github.sha }}

  build-app:
    runs-on: windows-latest

    steps:
      - uses: dtolnay/rust-toolchain@1.97.1

      - name: Configure Git line endings
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: bin/xrf-ui/package.json
          run_install: false

      - name: Use Node.js 24.x
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: pnpm
          cache-dependency-path: bin/xrf-ui/pnpm-lock.yaml

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install UI dependencies
        run: pnpm.cmd --dir bin/xrf-ui install --frozen-lockfile

      - name: Build UI
        run: pnpm.cmd --dir bin/xrf-ui build

      - name: Record the build timestamp
        shell: bash
        run: echo "XRF_BUILD_TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      # Relaxed for turnaround; `build_optimized.yml` builds what the committed profile describes.
      - name: Build application
        working-directory: bin/xrf-app
        env:
          CARGO_PROFILE_RELEASE_LTO: thin
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 16
        run: ..\xrf-ui\node_modules\.bin\tauri.cmd build --ci --no-bundle --config tauri.ci.conf.json

      - name: Name the application build as a development artifact
        run: Move-Item target/release/xrf-app.exe target/release/xrf-app-dev.exe

      - name: Upload application build artifacts
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          name: xrf-app
          path: target/release/xrf-app-dev.exe
          retention-days: 1

  upload-nightly:
    if: ${{ github.ref_name == 'main' && github.event_name != 'pull_request' }}
    needs: [ checks-rust, build-cli, check-typescript, build-app ]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Update nightly tag
        uses: EndBug/latest-tag@latest
        id: update-nightly-tag
        with:
          ref: nightly

      - uses: actions/download-artifact@v8
        with:
          name: xrf-cli

      - name: Publish nightly cli build
        if: ${{ steps.update-nightly-tag.outcome == 'success' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload --clobber nightly xrf-cli-dev.exe

      - uses: actions/download-artifact@v8
        with:
          name: xrf-app

      - name: Publish nightly application build
        if: ${{ steps.update-nightly-tag.outcome == 'success' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload --clobber nightly xrf-app-dev.exe
