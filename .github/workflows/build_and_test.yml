name: Build and test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  XRF_BUILD_KIND: development
  CARGO_PROFILE_DEV_DEBUG: 0
  npm_config_audit: "false"
  npm_config_fund: "false"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check-rust-windows:
    runs-on: windows-latest
    env:
      # WARP under D3D12 is always there, so a GPU test that finds no device fails rather than skips.
      XRF_TEST_REQUIRE_GPU: 1

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/lfs-assets

      - uses: ./.github/actions/pinned-toolchain

      - uses: ./.github/actions/native-sdks

      - uses: Swatinem/rust-cache@v2
        with:
          cache-workspace-crates: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-make@0.37.24

      - name: Check formatting
        run: cargo make check-format

      - name: Run linter
        run: cargo make lint

      - name: Run workspace tests and verify frontend bindings
        run: cargo make test

      - name: Run derive macro diagnostics
        run: cargo make test-derive

      - name: Run documentation examples
        run: cargo make test-doc

      - name: Discard trybuild scratch crates
        if: always()
        shell: bash
        run: rm -rf target/tests

  build-cli-windows:
    runs-on: windows-latest
    env:
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 16
      CARGO_PROFILE_RELEASE_OPT_LEVEL: 2

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/pinned-toolchain

      - uses: Swatinem/rust-cache@v2
        with:
          cache-workspace-crates: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Record the build timestamp
        shell: bash
        run: echo "XRF_BUILD_TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-make@0.37.24

      - name: Build CLI
        run: cargo make build-cli-release

      - name: Mark the CLI binary as a development build
        run: Move-Item target/release/xrf-cli.exe target/release/xrf-cli-dev.exe

      - name: Upload the CLI binary
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          name: xrf-cli-windows
          path: target/release/xrf-cli-dev.exe
          retention-days: 1

  check-typescript:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: package.json
          run_install: false

      - name: Use Node.js 24.x
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          package-manager-cache: false

      - uses: ./.github/actions/pnpm-store
        id: pnpm-store

      - name: Restore frontend tool state
        id: frontend-tools
        uses: actions/cache/restore@v6
        with:
          path: |
            bin/xrf-ui/target/jest-cache
            bin/xrf-ui/target/eslint
            bin/xrf-ui/target/tsconfig.tsbuildinfo
            bin/xrf-ui/target/tsconfig.node.tsbuildinfo
            cli/target/eslint
            packages/*/target/jest-cache
            packages/*/target/eslint
            packages/*/target/tsconfig.tsbuildinfo
          key: frontend-tools-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            frontend-tools-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            frontend-tools-${{ runner.os }}-

      - name: Install TypeScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Save the pnpm store
        if: ${{ github.ref == 'refs/heads/main' && steps.pnpm-store.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ steps.pnpm-store.outputs.key }}

      - name: Typecheck TypeScript members
        run: pnpm -r typecheck

      - name: Run TypeScript tests
        run: pnpm -r test --maxWorkers=100%

      - name: Lint TypeScript members
        run: pnpm run lint

      - name: Save frontend tool state
        if: ${{ github.ref == 'refs/heads/main' && steps.frontend-tools.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: |
            bin/xrf-ui/target/jest-cache
            bin/xrf-ui/target/eslint
            bin/xrf-ui/target/tsconfig.tsbuildinfo
            bin/xrf-ui/target/tsconfig.node.tsbuildinfo
            cli/target/eslint
            packages/*/target/jest-cache
            packages/*/target/eslint
            packages/*/target/tsconfig.tsbuildinfo
          key: frontend-tools-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}

  build-app-windows:
    runs-on: windows-latest
    env:
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 16
      CARGO_PROFILE_RELEASE_OPT_LEVEL: 2

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/lfs-assets

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: package.json
          run_install: false

      - name: Use Node.js 24.x
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          package-manager-cache: false

      - uses: ./.github/actions/pnpm-store
        id: pnpm-store

      - uses: ./.github/actions/pinned-toolchain

      - uses: ./.github/actions/native-sdks

      - uses: Swatinem/rust-cache@v2
        with:
          cache-workspace-crates: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-make@0.37.24

      - name: Record the build timestamp
        shell: bash
        run: echo "XRF_BUILD_TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      # Packs the executable with the renderer resources it needs at runtime. XRF_BUILD_KIND comes from this
      # workflow (`development`).
      - name: Build and package the application as a development build
        env:
          PACKAGE_NAME: xrf-app-dev-windows-x64
        run: cargo make package-app

      # `package-app` installs the TypeScript dependencies, so the store is complete only now.
      - name: Save the pnpm store
        if: ${{ github.ref == 'refs/heads/main' && steps.pnpm-store.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ steps.pnpm-store.outputs.key }}

      - name: Upload the application archive
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          name: xrf-app
          path: target/package/xrf-app-dev-windows-x64.zip
          compression-level: 0
          retention-days: 1

  check-and-build-linux:
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 16
      CARGO_PROFILE_RELEASE_OPT_LEVEL: 2

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/lfs-assets

      - uses: ./.github/actions/pinned-toolchain

      - uses: Swatinem/rust-cache@v2
        with:
          cache-workspace-crates: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Plain commands instead of the Makefile tasks, because Linux builds without DLSS and the frontend bindings.
      - name: Run workspace tests on default features
        run: cargo test --verbose --workspace --lib --locked --exclude xrf-ipc-typescript

      - name: Run CLI tests
        run: cargo test --verbose -p xrf-cli --bins --locked

      - name: Run derive macro diagnostics
        run: cargo test --verbose --workspace --test ui --locked

      - name: Run documentation examples
        run: cargo test --verbose --workspace --doc --locked --exclude xrf-ipc-typescript

      - name: Discard trybuild scratch crates
        run: rm -rf target/tests

      - name: Record the build timestamp
        run: echo "XRF_BUILD_TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Build CLI
        run: cargo build -p xrf-cli --release --locked

      - name: Mark the CLI binary as a development build
        run: mv target/release/xrf-cli target/release/xrf-cli-dev

      - name: Upload the CLI binary
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          name: xrf-cli-linux
          path: target/release/xrf-cli-dev
          retention-days: 1

  publish-nightly:
    if: ${{ github.ref_name == 'main' && github.event_name != 'pull_request' }}
    needs: [ check-rust-windows, build-cli-windows, check-and-build-linux, check-typescript, build-app-windows ]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Update nightly tag
        uses: EndBug/latest-tag@8fcae8848c1e23fd8212258f69a9619bc62cad67 # v1.6.3
        id: update-nightly-tag
        with:
          ref: nightly

      - uses: actions/download-artifact@v8
        with:
          name: xrf-cli-windows

      - uses: actions/download-artifact@v8
        with:
          name: xrf-cli-linux

      - name: Publish the nightly CLI binaries
        if: ${{ steps.update-nightly-tag.outcome == 'success' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload --clobber nightly xrf-cli-dev.exe xrf-cli-dev

      - uses: actions/download-artifact@v8
        with:
          name: xrf-app

      - name: Publish the nightly application archive
        if: ${{ steps.update-nightly-tag.outcome == 'success' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload --clobber nightly xrf-app-dev-windows-x64.zip

  release-e2e:
    if: ${{ github.ref_name == 'main' && github.event_name != 'pull_request' }}
    needs: publish-nightly
    uses: xray-forge/xrf-tools-e2e/.github/workflows/e2e.yml@main
    with:
      e2e_ref: main
