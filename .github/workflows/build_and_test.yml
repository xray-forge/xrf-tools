name: Build and test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  XRF_BUILD_KIND: development
  CARGO_PROFILE_RELEASE_LTO: "false"
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 16
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check-rust-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('.github/workflows/build_and_test.yml') }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run linter
        run: cargo clippy --workspace --all-targets --features xrf-app/typescript-bindings -- -D warnings

      - name: Run workspace tests and verify frontend bindings
        run: cargo test --verbose --workspace --lib --bins --features xrf-app/typescript-bindings

  build-cli-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('.github/workflows/build_and_test.yml') }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Record the build timestamp
        shell: bash
        run: echo "XRF_BUILD_TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Build CLI
        run: cargo build -p xrf-cli --release --locked

      - name: Mark the CLI binary as a development build
        run: Move-Item target/release/xrf-cli.exe target/release/xrf-cli-dev.exe

      - name: Upload the CLI binary
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          name: xrf-cli-windows
          path: target/release/xrf-cli-dev.exe
          retention-days: 1

  check-typescript:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: bin/xrf-ui/package.json
          run_install: false

      - name: Use Node.js 24.x
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: pnpm
          cache-dependency-path: bin/xrf-ui/pnpm-lock.yaml

      - name: Restore frontend tool state
        id: frontend-tools
        uses: actions/cache/restore@v6
        with:
          path: |
            bin/xrf-ui/target/jest-cache
            bin/xrf-ui/target/eslint
            bin/xrf-ui/target/tsconfig.tsbuildinfo
            bin/xrf-ui/target/tsconfig.node.tsbuildinfo
          key: frontend-tools-${{ runner.os }}-${{ hashFiles('bin/xrf-ui/pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            frontend-tools-${{ runner.os }}-${{ hashFiles('bin/xrf-ui/pnpm-lock.yaml') }}-
            frontend-tools-${{ runner.os }}-

      - name: Install UI dependencies
        run: pnpm --dir bin/xrf-ui install --frozen-lockfile

      - name: Typecheck UI
        run: pnpm --dir bin/xrf-ui typecheck

      - name: Run UI tests
        run: pnpm --dir bin/xrf-ui test --maxWorkers=100%

      - name: Lint UI
        run: pnpm --dir bin/xrf-ui lint

      - name: Save frontend tool state
        if: ${{ github.ref == 'refs/heads/main' && steps.frontend-tools.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: |
            bin/xrf-ui/target/jest-cache
            bin/xrf-ui/target/eslint
            bin/xrf-ui/target/tsconfig.tsbuildinfo
            bin/xrf-ui/target/tsconfig.node.tsbuildinfo
          key: frontend-tools-${{ runner.os }}-${{ hashFiles('bin/xrf-ui/pnpm-lock.yaml') }}-${{ github.sha }}

  build-app-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: bin/xrf-ui/package.json
          run_install: false

      - name: Use Node.js 24.x
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: pnpm
          cache-dependency-path: bin/xrf-ui/pnpm-lock.yaml

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('.github/workflows/build_and_test.yml') }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install UI dependencies
        run: pnpm.cmd --dir bin/xrf-ui install --frozen-lockfile

      - name: Build UI
        run: pnpm.cmd --dir bin/xrf-ui build

      - name: Record the build timestamp
        shell: bash
        run: echo "XRF_BUILD_TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Build application
        working-directory: bin/xrf-app
        run: ..\xrf-ui\node_modules\.bin\tauri.cmd build --ci --no-bundle --config tauri.ci.conf.json

      - name: Mark the application binary as a development build
        run: Move-Item target/release/xrf-app.exe target/release/xrf-app-dev.exe

      - name: Upload the application binary
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          name: xrf-app
          path: target/release/xrf-app-dev.exe
          retention-days: 1

  check-and-build-linux:
    runs-on: ubuntu-latest

    steps:
      # Kept although nothing here runs clippy: rustup installs every component rust-toolchain.toml lists
      # on the first cargo call regardless of use, measured at ~15s, so removing this costs more.
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: actions/checkout@v6
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('.github/workflows/build_and_test.yml') }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Run workspace tests on default features
        run: cargo test --verbose --workspace --lib

      - name: Run CLI tests
        run: cargo test --verbose -p xrf-cli --bins

      - name: Run derive macro diagnostics
        run: cargo test --verbose -p xrf-error-derive --test ui

      - name: Discard trybuild scratch crates
        run: rm -rf target/tests

      - name: Record the build timestamp
        run: echo "XRF_BUILD_TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Build CLI
        run: cargo build -p xrf-cli --release --locked

      - name: Mark the CLI binary as a development build
        run: mv target/release/xrf-cli target/release/xrf-cli-dev

      - name: Upload the CLI binary
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          name: xrf-cli-linux
          path: target/release/xrf-cli-dev
          retention-days: 1

  publish-nightly:
    if: ${{ github.ref_name == 'main' && github.event_name != 'pull_request' }}
    needs: [ check-rust-windows, build-cli-windows, check-and-build-linux, check-typescript, build-app-windows ]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Update nightly tag
        uses: EndBug/latest-tag@latest
        id: update-nightly-tag
        with:
          ref: nightly

      - uses: actions/download-artifact@v8
        with:
          name: xrf-cli-windows

      - uses: actions/download-artifact@v8
        with:
          name: xrf-cli-linux

      - name: Publish the nightly CLI binaries
        if: ${{ steps.update-nightly-tag.outcome == 'success' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload --clobber nightly xrf-cli-dev.exe xrf-cli-dev

      - uses: actions/download-artifact@v8
        with:
          name: xrf-app

      - name: Publish the nightly application binary
        if: ${{ steps.update-nightly-tag.outcome == 'success' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload --clobber nightly xrf-app-dev.exe

  release-e2e:
    if: ${{ github.ref_name == 'main' && github.event_name != 'pull_request' }}
    needs: publish-nightly
    uses: xray-forge/xrf-tools-e2e/.github/workflows/e2e.yml@main
    with:
      e2e_ref: main
