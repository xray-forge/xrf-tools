name: Build and test ubuntu

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  XRF_BUILD_KIND: development

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: actions/checkout@v6
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Run xray crates tests
        run: cargo test --verbose --workspace --lib

      - name: Run CLI tests
        run: cargo test --verbose -p xrf-cli --bins

      - name: Run derive macro diagnostics
        run: cargo test --verbose -p xrf-error-derive --test ui

      - name: Record the build timestamp
        run: echo "XRF_BUILD_TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      # Relaxed for turnaround; `build_optimized.yml` builds what the committed profile describes.
      - name: Build CLI
        env:
          CARGO_PROFILE_RELEASE_LTO: thin
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 16
        run: cargo build -p xrf-cli --release --locked

      - name: Name the CLI build as a development artifact
        run: mv target/release/xrf-cli target/release/xrf-cli-dev

      - name: Upload CLI build artifacts
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          name: xrf-cli
          path: target/release/xrf-cli-dev
          retention-days: 1

  upload-nightly:
    if: ${{ github.ref_name == 'main' && github.event_name != 'pull_request' }}
    needs: [ build ]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Update nightly tag
        uses: EndBug/latest-tag@latest
        id: update-nightly-tag
        with:
          ref: nightly

      - uses: actions/download-artifact@v8
        with:
          name: xrf-cli

      - name: Publish nightly cli build
        if: ${{ steps.update-nightly-tag.outcome == 'success' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload --clobber nightly xrf-cli-dev
