xrf-vfs = { path = "crates/xrf-vfs" }
xrf-visual = { path = "crates/xrf-visual" }
xrf-xml = { path = "crates/xrf-xml" }

# Size-optimised: level 3 measured 3.7% faster for 36-40% larger binaries.
[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

# Keep development builds fast.
[profile.dev]
opt-level = 0

# Development with optimisation, in its own target folder: the workspace at level 1, near release on byte loops while
# it still builds fast, and dependencies at 3, built once, where image encoding, shader compilation and decoding run.
[profile.dev-optimized]
inherits = "dev"
opt-level = 1

[profile.dev-optimized.package."*"]
opt-level = 3

[workspace.lints.rust]
dead_code = "allow"

[workspace.lints.clippy]
extra_unused_type_parameters = "allow"
doc_lazy_continuation = "allow"
module_inception = "allow"
