[workspace]
resolver = "3"
members = [
  "bin/xrf-app",
  "bin/xrf-cli",
  "crates/xrf-animation-envelope",
  "crates/xrf-anm",
  "crates/xrf-archive",
  "crates/xrf-archive-stats",
  "crates/xrf-build-info",
  "crates/xrf-chunk",
  "crates/xrf-dds",
  "crates/xrf-dialog",
  "crates/xrf-dltx",
  "crates/xrf-efd",
  "crates/xrf-engine-target",
  "crates/xrf-environment",
  "crates/xrf-error",
  "crates/xrf-error-derive",
  "crates/xrf-export",
  "crates/xrf-extension",
  "crates/xrf-gamedata",
  "crates/xrf-gamemtl",
  "crates/xrf-ipc-typescript",
  "crates/xrf-job",
  "crates/xrf-level",
  "crates/xrf-light-anim",
  "crates/xrf-ltx",
  "crates/xrf-ltx-inspect",
  "crates/xrf-lua",
  "crates/xrf-lzhuf",
  "crates/xrf-material",
  "crates/xrf-math",
  "crates/xrf-ogf",
  "crates/xrf-omf",
  "crates/xrf-output",
  "crates/xrf-pack",
  "crates/xrf-particles",
  "crates/xrf-ppe",
  "crates/xrf-renderer",
  "crates/xrf-report",
  "crates/xrf-shaders",
  "crates/xrf-skeleton",
  "crates/xrf-sound",
  "crates/xrf-spawn",
  "crates/xrf-test-utils",
  "crates/xrf-texture",
  "crates/xrf-thm",
  "crates/xrf-translation",
  "crates/xrf-typescript",
  "crates/xrf-utils",
  "crates/xrf-vfs",
  "crates/xrf-visual",
  "crates/xrf-xml",
]

[workspace.package]
edition = "2024"
rust-version = "1.99.0"

[workspace.dependencies]
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
byteorder = "1.5.0"
bytemuck = { version = "1.25.2", features = ["derive"] }
bytes = "1.12.1"
ddsfile = "0.5.2"
derive_more = "2.1.1"
env_logger = "0.11.11"
glam = { version = "0.33.12", features = ["bytemuck"] }
fileslice = { version = "0.8.0", default-features = false }
getrandom = "0.4.3"
http-body-util = "0.1.5"
hyper = { version = "1.11.1", features = ["http1", "server"] }
hyper-util = { version = "0.1.20", features = ["tokio"] }
image = { version = "0.25.10", default-features = false }
image_dds = "0.7.2"
indexmap = { version = "2.14.2", features = ["serde"] }
log = "0.4.34"
naga = { version = "30.0.1", features = ["wgsl-in"] }
lzokay = { version = "2.0.1", default-features = false, features = ["std", "compress", "decompress"] }
pollster = "0.4.0"
raw-window-handle = "0.6.2"
rayon = "1.12.0"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.151"
sysinfo = "0.39.6"
specta = { version = "=2.0.0-rc.25", features = ["derive", "serde_json", "uuid"] }
specta-serde = "0.0.12"
specta-typescript = "0.0.12"
specta-util = "0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["typescript"] }
tokio = { version = "1.53.1", features = ["net", "rt"] }
uuid = "1.26.1"
walkdir = "2.5.0"
wgpu = { version = "30.0.1", default-features = false, features = ["std", "parking_lot", "dx12", "vulkan", "wgsl"] }
xrf-animation-envelope = { path = "crates/xrf-animation-envelope" }
xrf-anm = { path = "crates/xrf-anm" }
xrf-archive = { path = "crates/xrf-archive" }
xrf-archive-stats = { path = "crates/xrf-archive-stats" }
xrf-build-info = { path = "crates/xrf-build-info" }
xrf-chunk = { path = "crates/xrf-chunk" }
xrf-dds = { path = "crates/xrf-dds" }
xrf-dialog = { path = "crates/xrf-dialog" }
xrf-dltx = { path = "crates/xrf-dltx" }
xrf-efd = { path = "crates/xrf-efd" }
xrf-error = { path = "crates/xrf-error" }
xrf-error-derive = { path = "crates/xrf-error-derive" }
xrf-export = { path = "crates/xrf-export" }
xrf-engine-target = { path = "crates/xrf-engine-target" }
xrf-environment = { path = "crates/xrf-environment" }
xrf-extension = { path = "crates/xrf-extension" }
xrf-gamedata = { path = "crates/xrf-gamedata" }
xrf-gamemtl = { path = "crates/xrf-gamemtl" }
xrf-ipc-typescript = { path = "crates/xrf-ipc-typescript" }
xrf-job = { path = "crates/xrf-job" }
xrf-level = { path = "crates/xrf-level" }
xrf-light-anim = { path = "crates/xrf-light-anim" }
xrf-ltx = { path = "crates/xrf-ltx" }
xrf-ltx-inspect = { path = "crates/xrf-ltx-inspect" }
xrf-lua = { path = "crates/xrf-lua" }
xrf-lzhuf = { path = "crates/xrf-lzhuf" }
xrf-material = { path = "crates/xrf-material" }
xrf-math = { path = "crates/xrf-math" }
xrf-ogf = { path = "crates/xrf-ogf" }
xrf-omf = { path = "crates/xrf-omf" }
xrf-output = { path = "crates/xrf-output" }
xrf-pack = { path = "crates/xrf-pack" }
xrf-particles = { path = "crates/xrf-particles" }
xrf-ppe = { path = "crates/xrf-ppe" }
xrf-renderer = { path = "crates/xrf-renderer" }
xrf-report = { path = "crates/xrf-report" }
xrf-shaders = { path = "crates/xrf-shaders" }
xrf-skeleton = { path = "crates/xrf-skeleton" }
xrf-sound = { path = "crates/xrf-sound" }
xrf-spawn = { path = "crates/xrf-spawn" }
xrf-test-utils = { path = "crates/xrf-test-utils" }
xrf-texture = { path = "crates/xrf-texture" }
xrf-thm = { path = "crates/xrf-thm" }
xrf-translation = { path = "crates/xrf-translation" }
xrf-typescript = { path = "crates/xrf-typescript" }
