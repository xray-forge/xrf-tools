# wgpu's release with D3D12's command list reachable from a HAL command encoder, which DLSS records into on D3D12, and
# bottom-level acceleration structures refit in place where they allow and ask for it; the whole family comes from the
# fork so one copy of each crate is built.
[patch.crates-io]
naga = { git = "https://github.com/xray-forge/xrf-wgpu", rev = "c64da79978429b535b435e9340010290b7107a17" }
naga-types = { git = "https://github.com/xray-forge/xrf-wgpu", rev = "c64da79978429b535b435e9340010290b7107a17" }
wgpu = { git = "https://github.com/xray-forge/xrf-wgpu", rev = "c64da79978429b535b435e9340010290b7107a17" }
wgpu-core = { git = "https://github.com/xray-forge/xrf-wgpu", rev = "c64da79978429b535b435e9340010290b7107a17" }
wgpu-core-deps-windows-linux-android = { git = "https://github.com/xray-forge/xrf-wgpu", rev = "c64da79978429b535b435e9340010290b7107a17" }
wgpu-hal = { git = "https://github.com/xray-forge/xrf-wgpu", rev = "c64da79978429b535b435e9340010290b7107a17" }
wgpu-naga-bridge = { git = "https://github.com/xray-forge/xrf-wgpu", rev = "c64da79978429b535b435e9340010290b7107a17" }
wgpu-types = { git = "https://github.com/xray-forge/xrf-wgpu", rev = "c64da79978429b535b435e9340010290b7107a17" }

# Size-optimised: level 3 measured 3.7% faster for 36-40% larger binaries.
[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

# Keep development builds fast.
[profile.dev]
opt-level = 0

# Development with optimisation, in its own target folder: the workspace at level 1, near release on byte loops while
# it still builds fast, and dependencies at 3, built once, where image encoding, shader compilation and decoding run.
[profile.dev-optimized]
inherits = "dev"
opt-level = 1
lto = "off"

[profile.dev-optimized.package."*"]
opt-level = 3
# Line tables keep dependency backtraces readable without the full debug information every link would otherwise merge.
debug = "line-tables-only"

# Release code with line tables, in its own target folder, so a profiler names the code that ships.
[profile.profiling]
inherits = "release"
debug = "line-tables-only"
strip = false

# The profiling build with the `tracy` feature, in its own target folder, so switching never rebuilds the other.
[profile.tracy]
inherits = "profiling"

[workspace.lints.rust]
dead_code = "allow"

[workspace.lints.clippy]
extra_unused_type_parameters = "allow"
doc_lazy_continuation = "allow"
module_inception = "allow"
