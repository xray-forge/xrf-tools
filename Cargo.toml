  "crates/xrf-anm",
  "crates/xrf-archive",
  "crates/xrf-archive-stats",
  "crates/xrf-build-info",
  "crates/xrf-chunk",
  "crates/xrf-dds",
  "crates/xrf-dialog",
  "crates/xrf-dlss",
  "crates/xrf-dltx",
  "crates/xrf-efd",
  "crates/xrf-engine-target",
  "crates/xrf-environment",
  "crates/xrf-error",
  "crates/xrf-error-derive",
  "crates/xrf-export",
  "crates/xrf-extension",
  "crates/xrf-gamedata",
  "crates/xrf-gamemtl",
  "crates/xrf-ipc-typescript",
  "crates/xrf-job",
  "crates/xrf-level",
  "crates/xrf-light-anim",
  "crates/xrf-ltx",
  "crates/xrf-ltx-inspect",
  "crates/xrf-lua",
  "crates/xrf-lzhuf",
  "crates/xrf-material",
  "crates/xrf-math",
  "crates/xrf-ogf",
  "crates/xrf-omf",
  "crates/xrf-output",
  "crates/xrf-pack",
  "crates/xrf-particles",
  "crates/xrf-ppe",
  "crates/xrf-renderer-core",
  "crates/xrf-renderer-derive",
  "crates/xrf-renderer",
  "crates/xrf-report",
  "crates/xrf-shaders",
  "crates/xrf-skeleton",
  "crates/xrf-sound",
  "crates/xrf-spawn",
  "crates/xrf-test-utils",
  "crates/xrf-texture",
  "crates/xrf-thm",
  "crates/xrf-translation",
  "crates/xrf-typescript",
  "crates/xrf-utils",
