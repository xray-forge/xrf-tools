[config]
default_to_workspace = false
skip_core_tasks = true

[env]
# Cargo features that every Cargo check task enables, so they share one build. CI runs the same tasks, so it uses the
# same list.
CHECK_FEATURES = "xrf-app/typescript-bindings,xrf-app/dlss,xrf-job/rayon"
# Tauri CLI version pinned by the `bin/xrf-app/ui` lockfile. Desktop tasks run it with Node from `bin/xrf-app/app`,
# which holds `tauri.conf.json`.
NODE_TAURI = "../ui/node_modules/@tauri-apps/cli/tauri.js"

# Checks.

[tasks.format]
description = "Format the Rust code."
category = "Verification"
command = "cargo"
args = ["fmt", "--all"]

[tasks.check-format]
description = "Check Rust formatting without changing files."
category = "Verification"
command = "cargo"
args = ["fmt", "--all", "--", "--check"]

[tasks.lint]
description = "Run Clippy on all workspace targets with CHECK_FEATURES. Warnings fail the task."
category = "Verification"
dependencies = ["fetch-sdks"]
command = "cargo"
args = ["clippy", "--workspace", "--all-targets", "--locked", "--features", "${CHECK_FEATURES}", "--", "-D", "warnings"]

[tasks.test]
description = "Run workspace library and binary tests with CHECK_FEATURES, including the frontend bindings check."
category = "Verification"
dependencies = ["fetch-sdks"]
command = "cargo"
args = ["test", "--workspace", "--lib", "--bins", "--locked", "--features", "${CHECK_FEATURES}"]

[tasks.test-derive]
description = "Run every derive crate's diagnostic snapshot tests with CHECK_FEATURES: each `tests/ui.rs` in the workspace."
category = "Verification"
dependencies = ["fetch-sdks"]
command = "cargo"
args = ["test", "--workspace", "--test", "ui", "--locked", "--features", "${CHECK_FEATURES}"]

[tasks.test-doc]
description = "Run the documentation examples of every workspace crate with CHECK_FEATURES, READMEs included."
category = "Verification"
dependencies = ["fetch-sdks"]
command = "cargo"
args = ["test", "--workspace", "--doc", "--locked", "--features", "${CHECK_FEATURES}"]

[tasks.install-ui]
description = "Install the locked TypeScript dependencies."
category = "Verification"
script_runner = "@shell"
script = "pnpm install --frozen-lockfile"

[tasks.test-ui]
description = "Run the tests of every TypeScript workspace member."
category = "Verification"
script_runner = "@shell"
script = "pnpm run test"

[tasks.verify-ui]
description = "Typecheck, test and lint every TypeScript workspace member."
category = "Verification"
dependencies = ["install-ui"]
script_runner = "@shell"
script = "pnpm run typecheck && pnpm run test && pnpm run lint"

[tasks.verify]
description = "Run every check that CI runs. Use it before pushing."
category = "Verification"
dependencies = ["check-format", "lint", "test", "test-derive", "test-doc", "verify-ui"]

# Builds.

[tasks.fetch-sdks]
description = "Fetch the pinned DLSS SDK, Vulkan headers, libclang and DXC into .sdks. Skips what is already at its pin."
category = "Build"
command = "node"
args = ["cli/sdks/fetch.mjs"]

[tasks.build-cli]
description = "Build the CLI in debug mode."
category = "Build"
command = "cargo"
args = ["build", "-p", "xrf-cli"]

[tasks.build-cli-release]
description = "Build the CLI in release mode."
category = "Build"
command = "cargo"
args = ["build", "-p", "xrf-cli", "--release", "--locked"]

[tasks.build-app]
description = "Build the desktop application in debug mode, without DLSS."
category = "Build"
dependencies = ["install-ui", "fetch-sdks"]
cwd = "bin/xrf-app/app"
command = "node"
args = ["${NODE_TAURI}", "build", "--debug", "--no-bundle"]

[tasks.build-app.env]
XRF_BUILD_KIND = { value = "development", condition = { env_not_set = ["XRF_BUILD_KIND"] } }

# `--no-bundle` skips the installers. `package-app` produces the archive the application ships as.
# Tauri copies the bundle's resources beside the executable but never prunes them, so one renamed or removed since an
# earlier build would otherwise ship.
[tasks.clear-app-resources]
description = "Remove the resources an earlier release build copied beside the executable."
category = "Build"
command = "node"
args = ["-e", "require('node:fs').rmSync('target/release/resources', { recursive: true, force: true })"]

[tasks.build-app-release]
description = "Build the desktop application in release mode, with DLSS."
category = "Build"
dependencies = ["install-ui", "fetch-sdks", "clear-app-resources"]
cwd = "bin/xrf-app/app"
command = "node"
args = ["${NODE_TAURI}", "build", "--no-bundle", "--features", "dlss", "--config", "tauri.dlss.conf.json"]

[tasks.build-app-release.env]
XRF_BUILD_KIND = { value = "optimized", condition = { env_not_set = ["XRF_BUILD_KIND"] } }

[tasks.package-app]
description = "Build the release application and pack it into target/package/<PACKAGE_NAME>.zip (default xrf-app-windows-x64)."
category = "Build"
dependencies = ["build-app-release"]
command = "node"
args = ["cli/package/app.mjs", "--name", "${PACKAGE_NAME}"]

[tasks.package-app.env]
PACKAGE_NAME = { value = "xrf-app-windows-x64", condition = { env_not_set = ["PACKAGE_NAME"] } }

# Development.

[tasks.dev-app]
description = "Run the desktop backend and UI in watch mode."
category = "Development"
dependencies = ["install-ui", "fetch-sdks"]
cwd = "bin/xrf-app/app"
command = "node"
args = ["${NODE_TAURI}", "dev"]

[tasks.dev-app-optimized]
description = "Run the desktop application in watch mode with DLSS and the dev-optimized profile (workspace opt-level 1, dependencies 3)."
category = "Development"
dependencies = ["fetch-sdks", "install-ui"]
cwd = "bin/xrf-app/app"
command = "node"
args = ["${NODE_TAURI}", "dev", "--features", "dlss", "--config", "tauri.dlss.conf.json", "--", "--profile", "dev-optimized"]

[tasks.dev-app-profiling]
description = "Run the desktop application in watch mode with DLSS and the profiling profile (release code with line tables)."
category = "Development"
dependencies = ["fetch-sdks", "install-ui"]
cwd = "bin/xrf-app/app"
command = "node"
args = ["${NODE_TAURI}", "dev", "--features", "dlss", "--config", "tauri.dlss.conf.json", "--", "--profile", "profiling"]

[tasks.serve-backend]
description = "Run the desktop backend without the UI dev server."
category = "Development"
dependencies = ["fetch-sdks"]
command = "cargo"
args = ["run", "-p", "xrf-app", "--no-default-features"]

[tasks.serve-ui]
description = "Run the UI dev server without the backend."
category = "Development"
cwd = "bin/xrf-app/ui"
script_runner = "@shell"
script = "pnpm run dev"

# Documentation and generated code.

[tasks.doc]
description = "Generate Rust documentation for workspace crates, without dependencies."
category = "Documentation"
dependencies = ["fetch-sdks"]
command = "cargo"
args = ["doc", "--workspace", "--no-deps"]

[tasks.doc-cli]
description = "Generate the CLI command reference from the clap definitions into target/doc-commands."
category = "Documentation"
command = "cargo"
args = ["run", "-p", "xrf-cli", "--", "docs", "generate", "--dest", "target/doc-commands"]

[tasks.generate-typescript-bindings]
description = "Emit the Specta-generated frontend types and Tauri command bindings."
category = "Code generation"
dependencies = ["fetch-sdks"]
command = "cargo"
args = [
  "test",
  "-p",
  "xrf-app",
  "--features",
  "typescript-bindings",
  "--",
  # Ignored so a plain workspace test run only verifies the mirrors; rewriting them is intentional.
  "--ignored",
  "--exact",
  "ipc::bindings::generator::export_typescript_bindings",
]

[tasks.format-typescript-bindings]
description = "Apply the frontend formatting and lint rules to the generated mirrors."
category = "Code generation"
cwd = "packages/xrf-ipc"
script_runner = "@shell"
script = "pnpm run format:bindings"

[tasks.generate-typescript]
description = "Regenerate and format the frontend mirrors of serialized Rust types."
category = "Code generation"
dependencies = ["generate-typescript-bindings", "format-typescript-bindings"]

[tasks.export-helper-icons]
description = "Export the Material icons the renderer's helper icon manifest names, as the UI draws them."
category = "Code generation"
cwd = "packages/xrf-ui"
script_runner = "@shell"
script = "node cli/export-helper-icons.mjs ../../crates/xrf-renderer/helper-icons/manifest.json"

[tasks.generate-helper-icons]
description = "Export the helper icons and rasterise them into the renderer's bundled atlas."
category = "Code generation"
dependencies = ["export-helper-icons"]
command = "cargo"
args = [
  "test",
  "-p",
  "xrf-renderer",
  "--lib",
  "--",
  # Ignored so a plain test run only checks the atlas; rewriting it is intentional.
  "--ignored",
  "--exact",
  "tests::helper_icons::generate_helper_icon_atlas",
]

# Maintenance.

[tasks.clean]
description = "Remove workspace build artifacts."
category = "Maintenance"
command = "cargo"
args = ["clean"]
